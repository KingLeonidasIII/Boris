<script>

"use strict";


/* ==================================================
   DOM
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");


/* ==================================================
   CANVAS
================================================== */

let width = 0;

let height = 0;

let dpr = 1;


function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        Math.max(
            1,
            window.innerWidth
        );


    height =
        Math.max(
            1,
            window.innerHeight
        );


    canvas.width =
        Math.floor(
            width * dpr
        );


    canvas.height =
        Math.floor(
            height * dpr
        );


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
        Only reposition the player
        if its current coordinates
        are invalid.
    */

    if (
        !Number.isFinite(player.x)
    ) {

        player.x =
            width / 2;
    }


    if (
        !Number.isFinite(player.y)
    ) {

        player.y =
            height / 2;
    }


    /*
        Keep the player inside the
        arena after resizing.
    */

    player.x =
        Math.max(
            player.radius,
            Math.min(
                width -
                player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                height -
                player.radius,
                player.y
            )
        );
}


window.addEventListener(
    "resize",
    resize
);


/* ==================================================
   KEYBOARD
================================================== */

const keys =
    Object.create(null);


function keyDown(event) {

    const key =
        event.key.toLowerCase();


    keys[key] =
        true;


    const gameKeys = [

        "w",
        "a",
        "s",
        "d",

        "i",
        "j",
        "k",
        "l",

        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",

        " ",
        "shift",

        "p",
        "r",
        "h",

        "b",

        "escape",

        "enter",

        "1",
        "2",
        "3",
        "4",
        "5",
        "6",
        "7",
        "8",
        "9",

        "q",
        "e"
    ];


    if (
        gameKeys.includes(key)
    ) {

        event.preventDefault();
    }


    /*
        Browser key-repeat should not
        repeatedly toggle menus or
        abilities.
    */

    if (
        event.repeat
    ) {

        return;
    }


    /* ==============================================
       HOME
    ============================================== */

    if (
        homeScreen
    ) {

        if (
            key === "enter" ||
            key === " "
        ) {

            startRound();

            return;
        }


        if (
            key === "b"
        ) {

            showAbilities();

            return;
        }


        if (
            key === "escape" &&
            abilityScreen
        ) {

            showHome();

            return;
        }


        /*
            Ability shortcuts from
            the ability screen.
        */

        if (
            abilityScreen
        ) {

            handleAbilityKey(
                key
            );

            return;
        }


        return;
    }


    /* ==============================================
       SHOP
    ============================================== */

    if (
        key === "p" &&
        !gameOver
    ) {

        toggleShop();

        return;
    }


    /* ==============================================
       GAME OVER
    ============================================== */

    if (
        gameOver
    ) {

        if (
            key === "r"
        ) {

            restart();

        }

        else if (
            key === "h"
        ) {

            goHome();
        }


        return;
    }


    /* ==============================================
       GAMEPLAY
    ============================================== */

    if (
        key === " "
    ) {

        shoot();

    }

    else if (
        key === "shift"
    ) {

        dash();
    }
}


function handleAbilityKey(key) {

    const mapping = {

        "1": 0,
        "2": 1,
        "3": 2,
        "4": 3,
        "5": 4,
        "6": 5,
        "7": 6,
        "8": 7,
        "9": 8,

        "q": 9,
        "w": 10,
        "e": 11,
        "r": 12
    };


    if (
        Object.prototype.hasOwnProperty.call(
            mapping,
            key
        )
    ) {

        toggleAbility(
            mapping[key]
        );
    }
}


window.addEventListener(
    "keydown",
    keyDown
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


/*
    Prevent stuck keys when the
    browser loses focus.
*/

window.addEventListener(
    "blur",
    function() {

        for (
            const key in keys
        ) {

            keys[key] = false;
        }
    }
);


/* ==================================================
   GAME STATE
================================================== */

let paused =
    false;

let gameOver =
    false;

let homeScreen =
    true;

let abilityScreen =
    false;

let score =
    0;

let orbs =
    0;

let timeAlive =
    0;

let spawnTimer =
    0;

let orbTimer =
    0;

let shopCooldown =
    0;

let shopReadyDelay =
    1.5;

let screenShake =
    0;

let lastTime =
    0;


const SHOP_COOLDOWN_TIME =
    10;


/* ==================================================
   OBJECT ARRAYS
================================================== */

const bullets = [];

const enemies = [];

const orbsOnMap = [];

const particles = [];


/* ==================================================
   COLORS
================================================== */

const COLORS = {

    bg:
        "#05050a",

    grid:
        "rgba(0,255,255,0.07)",

    cyan:
        "#00ffff",

    red:
        "#ff1744",

    yellow:
        "#ffe600",

    white:
        "#ffffff",

    scatter:
        "#ff66cc"
};


/* ==================================================
   HIGH SCORE
================================================== */

let highScore =
    0;


try {

    highScore =
        Number(
            localStorage.getItem(
                "neonEscapeHighScore"
            )
        ) || 0;

}

catch (error) {

    highScore =
        0;
}


/* ==================================================
   PERMANENT ABILITIES
================================================== */

/*
    These are the 13 permanent abilities.

    They are not shop upgrades.

    Their selected state is saved
    separately in localStorage.

    The effects are deliberately
    relatively small because the player
    can equip two simultaneously.
*/

const ABILITIES = [

    {
        id:
            "reinforcedHull",

        name:
            "REINFORCED HULL",

        description:
            "Start each run with +1 maximum health.",

        color:
            "#ff5555"
    },


    {
        id:
            "emergencyShield",

        name:
            "EMERGENCY SHIELD",

        description:
            "The first enemy collision of each run is absorbed without losing health.",

        color:
            "#66ccff"
    },


    {
        id:
            "magneticCore",

        name:
            "MAGNETIC CORE",

        description:
            "Yellow orbs are attracted from 85 pixels away instead of only on contact.",

        color:
            "#ffe600"
    },


    {
        id:
            "scavenger",

        name:
            "SCAVENGER",

        description:
            "Enemy kills have a 12% chance to create an extra yellow orb.",

        color:
            "#ffe600"
    },


    {
        id:
            "quickStart",

        name:
            "QUICK START",

        description:
            "Begin every run with the first 5 seconds of enemy spawning slowed by 25%.",

        color:
            "#00ffff"
    },


    {
        id:
            "overchargedCore",

        name:
            "OVERCHARGED CORE",

        description:
            "Your normal cannon and scatter pellets deal 15% more damage.",

        color:
            "#ff9933"
    },


    {
        id:
            "stabilizers",

        name:
            "STABILIZERS",

        description:
            "Your movement speed is permanently increased by 10%.",

        color:
            "#00ff88"
    },


    {
        id:
            "afterburner",

        name:
            "AFTERBURNER",

        description:
            "Dash cooldown is permanently reduced by 12%.",

        color:
            "#a66cff"
    },


    {
        id:
            "quickHands",

        name:
            "QUICK HANDS",

        description:
            "The cannon's base firing delay is permanently reduced by 10%.",

        color:
            "#00ffff"
    },


    {
        id:
            "thickBarrel",

        name:
            "THICK BARREL",

        description:
            "Bullets travel 12% faster and remain active slightly longer.",

        color:
            "#ff7b00"
    },


    {
        id:
            "collector",

        name:
            "COLLECTOR",

        description:
            "Collected yellow orbs are worth 2 orbs every fifth pickup.",

        color:
            "#ffe600"
    },


    {
        id:
            "lastStand",

        name:
            "LAST STAND",

        description:
            "At 1 HP, movement speed increases by 20%.",

        color:
            "#ff1744"
    },


    {
        id:
            "combatTraining",

        name:
            "COMBAT TRAINING",

        description:
            "Enemy contact damage has a small knockback effect, giving you more room to recover.",

        color:
            "#ffffff"
    }
];


/*
    Exactly two slots.

    null means an empty slot.

    This array is loaded from storage
    before the Home Screen is displayed.
*/

let selectedAbilities = [
    null,
    null
];


/* ==================================================
   ABILITY STORAGE
================================================== */

const ABILITY_STORAGE_KEY =
    "neonEscapePermanentAbilities";


function loadAbilities() {

    try {

        const saved =
            localStorage.getItem(
                ABILITY_STORAGE_KEY
            );


        if (
            !saved
        ) {

            return;
        }


        const parsed =
            JSON.parse(
                saved
            );


        /*
            Only accept a valid array
            with exactly two slots.
        */

        if (
            !Array.isArray(parsed) ||
            parsed.length !== 2
        ) {

            return;
        }


        const validIds =
            new Set(
                ABILITIES.map(
                    ability =>
                        ability.id
                )
            );


        const cleaned =
            parsed.map(
                id =>
                    validIds.has(id)
                        ? id
                        : null
            );


        /*
            Prevent the same ability
            from occupying both slots
            if a corrupted storage value
            somehow contains duplicates.
        */

        if (
            cleaned[0] !== null &&
            cleaned[0] === cleaned[1]
        ) {

            cleaned[1] =
                null;
        }


        selectedAbilities =
            cleaned;

    }

    catch (error) {

        /*
            Invalid or unavailable storage
            must never prevent the game from
            starting.
        */

        selectedAbilities = [
            null,
            null
        ];
    }
}


function saveAbilities() {

    try {

        localStorage.setItem(
            ABILITY_STORAGE_KEY,
            JSON.stringify(
                selectedAbilities
            )
        );

    }

    catch (error) {

        /*
            If storage is blocked, the
            abilities still work during
            the current page session.
        */
    }
}


loadAbilities();


/* ==================================================
   ABILITY HELPERS
================================================== */

function hasAbility(id) {

    return (
        selectedAbilities[0] === id ||
        selectedAbilities[1] === id
    );
}


function abilityIndex(id) {

    return selectedAbilities.indexOf(
        id
    );
}


/* ==================================================
   TOGGLE ABILITY
================================================== */

function toggleAbility(index) {

    if (
        !abilityScreen
    ) {

        return;
    }


    if (
        index < 0 ||
        index >= ABILITIES.length
    ) {

        return;
    }


    const id =
        ABILITIES[index].id;


    const existingSlot =
        abilityIndex(id);


    /*
        If already equipped,
        remove it.
    */

    if (
        existingSlot !== -1
    ) {

        selectedAbilities[
            existingSlot
        ] =
            null;


        saveAbilities();

        updateAbilityMessage();

        return;
    }


    /*
        Find an empty slot.
    */

    const emptySlot =
        selectedAbilities.indexOf(
            null
        );


    if (
        emptySlot !== -1
    ) {

        selectedAbilities[
            emptySlot
        ] =
            id;


        saveAbilities();

        updateAbilityMessage();

        return;
    }


    /*
        Both slots are occupied.

        Do not silently replace an
        existing ability. This prevents
        accidental loadout changes.
    */
}


/* ==================================================
   PLAYER
================================================== */

const player = {

    x:
        0,

    y:
        0,

    radius:
        14,

    moveSpeed:
        300,

    aimAngle:
        0,

    aimX:
        1,

    fireRate:

    bulletSpeed:
        850,

    bulletDamage:
        1,

    dashCooldown:
        0,

    dashMaxCooldown:
        1.1,

    dashTime:
        0,

    dashDuration:
        0.12,

    dashSpeed:
        1000,

    maxHealth:
        3,

    health:
        3,

    emergencyShieldUsed:
        false,

    pickupCount:
        0
};


/* ==================================================
   SHOP UPGRADES
================================================== */

const upgrades = {

    rapid: {

        level:
            0,

        maxLevel:
            3,

        cost:
            3
    },


    heavy: {

        level:
            0,

        maxLevel:
            2,

        cost:
            5
    },


    thrusters: {

        level:
            0,

        maxLevel:
            3,

        cost:
            4
    },


    overdrive: {

        level:
            0,

        maxLevel:
            2,

        cost:
            6
    },


    scatter: {

        level:
            0,

        maxLevel:
            1,

        cost:
            12
    }
};


/* ==================================================
   INPUT HELPER
================================================== */

function down(key) {

    return keys[key] === true;
}


/* ==================================================
   DISTANCE
================================================== */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* ==================================================
   APPLY UPGRADES
================================================== */

function applyUpgrades() {

    /*
        Base fire rate.
    */

    let fireRate =
        0.16;


    /*
        Quick Hands permanent ability.
    */

    if (
        hasAbility(
            "quickHands"
        )
    ) {

        fireRate *=
            0.90;
    }


    /*
        Rapid Fire shop upgrade.
    */

    fireRate *=
        Math.pow(
            0.8,
            upgrades.rapid.level
        );


    player.fireRate =
        fireRate;


    /*
        Base bullet damage.
    */

    let damage =
        1 +
        upgrades.heavy.level;


    /*
        Overcharged Core.
    */

    if (
        hasAbility(
            "overchargedCore"
        )
    ) {

        damage *=
            1.15;
    }


    player.bulletDamage =
        damage;


    /*
        Movement.
    */

    let movement =
        300;


    if (
        hasAbility(
            "stabilizers"
        )
    ) {

        movement *=
            1.10;
    }


    player.moveSpeed =
        movement *
        (
            1 +
            upgrades.thrusters.level *
            0.15
        );


    /*
        Dash.
    */

    let dashCooldown =
        1.1;


    if (
        hasAbility(
            "afterburner"
        )
    ) {

        dashCooldown *=
            0.88;
    }


    dashCooldown *=
        Math.pow(
            0.8,
            upgrades.overdrive.level
        );


    player.dashMaxCooldown =
        dashCooldown;


    /*
        Bullet speed.
    */

    player.bulletSpeed =
        850 *
        (
            hasAbility(
                "thickBarrel"
            )
                ? 1.12
                : 1
        );
}


/* ==================================================
   RESET UPGRADES
================================================== */

function resetUpgrades() {

    for (
        const upgrade of
        Object.values(upgrades)
    ) {

        upgrade.level =
            0;
    }


    applyUpgrades();
}


/* ==================================================
   CLEAR OBJECTS
================================================== */

function clearRoundObjects() {

    bullets.length =
        0;

    enemies.length =
        0;

    orbsOnMap.length =
        0;

    particles.length =
        0;
}


/* ==================================================
   RESET PLAYER
================================================== */

function resetPlayer() {

    /*
        Reinforced Hull is permanent
        for every run, but health is
        still reset when a new run begins.
    */

    player.maxHealth =
        hasAbility(
            "reinforcedHull"
        )
            ? 4
            : 3;


    player.health =
        player.maxHealth;


    player.x =
        width / 2;


    player.y =
        height / 2;


    player.fireCooldown =
        0;


    player.dashCooldown =
        0;


    player.dashTime =
        0;


    player.aimAngle =
        0;


    player.aimX =
        1;


    player.aimY =
        0;


    player.dashX =
        1;


    player.dashY =
        0;


    player.emergencyShieldUsed =
        false;


    player.pickupCount =

        false;

    score =
        0;

    orbs =

        0;

    lastTime =
        0;

    resetPlayer();

    resetUpgrades();

/* ==================================================
   BUY UPGRADE
================================================== */

function buyUpgrade(id) {

    if (
        !paused ||
        gameOver ||
        homeScreen
    ) {

        return;
    }


    /*
        Repair.
    */

    if (
        id === "repair"
    ) {

        if (
            orbs >= 2 &&
            player.health <
            player.maxHealth
        ) {

            orbs -=
                2;


            player.health +=
                1;


            makeParticles(
                player.x,
                player.y,
                COLORS.cyan,
                18,
                180
            );


            updateShopMessage();
        }


        return;
    }


    const upgrade =
        upgrades[id];


    if (
        !upgrade
    ) {

        return;
    }


    if (
        upgrade.level >=
        upgrade.maxLevel
    ) {

        return;
    }


    if (
        orbs <
        upgrade.cost
    ) {

        return;
    }


    orbs -=
        upgrade.cost;


    upgrade.level +=
        1;


    applyUpgrades();


    makeParticles(
        player.x,
        player.y,
        COLORS.yellow,
        18,
        180
    );


    updateShopMessage();
}

/* ==================================================
   RANDOM EDGE POSITION
================================================== */

function randomEdgePosition(
    margin = 50
) {

    const side =
        Math.floor(
            Math.random() * 4
        );


    if (
        side === 0
    ) {

        return {

            x:
                Math.random() *
                width,

            y:
                -margin
        };
    }


    if (
        side === 1
    ) {

        return {

            x:
                width + margin,

            y:
                Math.random() *
                height
        };
    }


    if (
        side === 2
    ) {

        return {

            x:
                Math.random() *
                width,

            y:
                height + margin
        };
    }


    return {

        x:
            -margin,

        y:
            Math.random() *
            height
    };
}


/* ==================================================
   DIFFICULTY
================================================== */

function getEnemySpawnInterval() {

    return Math.max(
        0.16,
        1 -
        timeAlive *
        0.009
    );
}


/*
    Yellow orbs now use the same
    difficulty progression as enemies.

    At the beginning:

        Enemy interval = 1.0s
        Orb interval   = 2.5s

    As enemy spawning accelerates,
    orb spawning accelerates by the
    exact same relative progression.

    This means the opening remains
    deliberately quiet for both systems.
*/

function getOrbSpawnInterval() {

    const enemyInterval =
        getEnemySpawnInterval();


    const baseEnemyInterval =
        1;


    const relativeDifficulty =
        enemyInterval /
        baseEnemyInterval;


    return Math.max(
        0.65,
        2.5 *
        relativeDifficulty
    );
}


/* ==================================================
   SPAWN ENEMY
================================================== */

function spawnEnemy() {

    const position =
        randomEdgePosition();


    const difficulty =
        1 +
        timeAlive / 30;


    const roll =
        Math.random();


    let type =
        "normal";


    if (
        timeAlive > 20 &&
        roll < 0.20
    ) {

        type =
            "fast";
    }


    if (
        timeAlive > 45 &&
        roll > 0.82
    ) {

        type =
            "tank";
    }


    const enemy = {

        x:
            position.x,

        y:
            position.y,

        rotation:
            Math.random() *
            Math.PI *
            2,

        type:
            type,

        hitFlash:
            0
    };


    if (
        type === "fast"
    ) {

        enemy.radius =
            9;

        enemy.speed =
            115 *
            difficulty;

        enemy.hp =
            1;

        enemy.points =
            150;

    }

    else if (
        type === "tank"
    ) {

        enemy.radius =
            22;

        enemy.speed =
            42 *
            difficulty;

        enemy.hp =
            3;

        enemy.points =
            400;

    }

    else {

        enemy.radius =
            14;

        enemy.speed =
            62 *
            difficulty;

        enemy.hp =
            1;

        enemy.points =
            100;
    }


    enemies.push(
        enemy
    );
}


/* ==================================================
   SPAWN ORB
================================================== */

function spawnOrb() {

    const padding =
        70;


    orbsOnMap.push({

        x:
            padding +
            Math.random() *
            Math.max(
                1,
                width -
                padding * 2
            ),


        y:
            padding +
            Math.random() *
            Math.max(
                1,
                height -
                padding * 2
            ),


        radius:
            7,


        pulse:
            Math.random() *
            Math.PI *
            2,


        life:
            8
    });
}


/* ==================================================
   PARTICLES
================================================== */

function makeParticles(
    x,
    y,
    color,
    amount = 10,
    speed = 150
) {

    for (
        let i = 0;

        i < amount;

        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const velocity =
            speed *
            (
                0.3 +
                Math.random() *
                0.7
            );


        particles.push({

            x:
                x,

            y:
                y,

            dx:
                Math.cos(angle) *
                velocity,

            dy:
                Math.sin(angle) *
                velocity,

            life:
                0.3 +
                Math.random() *
                0.5,

            maxLife:
                0.8,

            size:
                1.5 +
                Math.random() *
                3,

            color:
                color
        });
    }
}


/* ==================================================
   FIRE BULLET
================================================== */

function fireBullet(
    angle,
    damage
) {

    const muzzle =
        31;


    const x =
        player.x +
        Math.cos(angle) *
        muzzle;


    const y =
        player.y +
        Math.sin(angle) *
        muzzle;


    bullets.push({

        x:
            x,

        y:
            y,

        dx:
            Math.cos(angle),

        dy:
            Math.sin(angle),

        radius:
            4,

        speed:
            player.bulletSpeed,

        damage:
            damage,

        life:
            hasAbility(
                "thickBarrel"
            )
                ? 1.40
                : 1.25
    });


    return {

        x:
            x,

        y:
            y
    };
}


/* ==================================================
   SHOOT
================================================== */

function shoot() {

    if (
        gameOver ||
        paused ||
        homeScreen ||
        player.fireCooldown > 0
    ) {

        return;
    }


    /*
        Scatter Cannon.
    */

    if (
        upgrades.scatter.level > 0
    ) {

        const pelletCount =
            7;


        const spread =
            0.72;


        for (
            let i = 0;

            i < pelletCount;

            i++
        ) {

            const t =
                i /
                (pelletCount - 1);


            const angle =
                player.aimAngle +
                (
                    t - 0.5
                ) *
                spread;


            const pelletDamage =
                player.bulletDamage *
                0.5;


            fireBullet(
                angle,
                pelletDamage
            );
        }


        const muzzle =
            31;


        makeParticles(

            player.x +
            Math.cos(
                player.aimAngle
            ) *
            muzzle,


            player.y +
            Math.sin(
                player.aimAngle
            ) *
            muzzle,


            COLORS.scatter,

            18,

            260
        );

    }

    else {

        const muzzle =
            fireBullet(
                player.aimAngle,
                player.bulletDamage
            );


        makeParticles(
            muzzle.x,
            muzzle.y,
            COLORS.white,
            8,
            220
        );
    }


    player.fireCooldown =
        player.fireRate;


    screenShake =
        Math.max(
            screenShake,
            upgrades.scatter.level > 0
                ? 3
                : 2
        );
}


/* ==================================================
   DASH
================================================== */

function dash() {

    if (
        gameOver ||
        paused ||
        homeScreen ||
        player.dashCooldown > 0
    ) {

        return;
    }


    let dx =
        0;

    let dy =
        0;


    if (
        down("w") ||
        down("arrowup")
    ) {

        dy -=
            1;
    }


    if (
        down("s") ||
        down("arrowdown")
    ) {

        dy +=
            1;
    }


    if (
        down("a") ||
        down("arrowleft")
    ) {

        dx -=
            1;
    }


    if (
        down("d") ||
        down("arrowright")
    ) {

        dx +=
            1;
    }


    const length =
        Math.hypot(
            dx,
            dy
        );


    if (
        length > 0
    ) {

        dx /=
            length;

        dy /=
            length;

    }

    else {

        dx =
            player.dashX;

        dy =
            player.dashY;
    }


    player.dashX =
        dx;


    player.dashY =
        dy;


    player.dashTime =
        player.dashDuration;


    player.dashCooldown =
        player.dashMaxCooldown;


    makeParticles(
        player.x,
        player.y,
        COLORS.cyan,
        25,
        260
    );
}


/* ==================================================
   DAMAGE PLAYER
================================================== */

function damagePlayer() {

    /*
        Emergency Shield absorbs exactly
        one collision per run.

        It does not prevent all damage.
    */

    if (
        hasAbility(
            "emergencyShield"
        ) &&
        !player.emergencyShieldUsed
    ) {

        player.emergencyShieldUsed =
            true;


        makeParticles(
            player.x,
            player.y,
            "#66ccff",
            35,
            280
        );


        screenShake =
            7;


        return;
    }


    player.health -=
        1;


    makeParticles(
        player.x,
        player.y,
        COLORS.red,
        30,
        250
    );


    screenShake =
        10;


    if (
        player.health <= 0
    ) {

        endGame();
    }
}


/* ==================================================
   UPDATE
================================================== */

function update(delta) {

    /*
        Shop cooldown continues while
        the shop is open.
    */

    if (
        shopCooldown > 0
    ) {

        shopCooldown =
            Math.max(
                0,
                shopCooldown -
                delta
            );
    }


    if (
        shopReadyDelay > 0
    ) {

        shopReadyDelay =
            Math.max(
                0,
                shopReadyDelay -
                delta
            );
    }


    /*
        Do not simulate the actual
        game while paused, dead, or
        on the Home Screen.

        Particles are still allowed
        to finish naturally.
    */

    if (
        paused ||
        gameOver ||
        homeScreen
    ) {

        updateParticles(
            delta
        );


        return;
    }


    timeAlive +=
        delta;


    score =
        Math.max(
            score,
            Math.floor(
                timeAlive * 10
            )
        );


    screenShake =
        Math.max(
            0,
            screenShake -
            delta * 12
        );


    /* ==============================================
       AIM
    ============================================== */

    let aimX =
        0;

    let aimY =
        0;


    if (
        down("i") ||
        down("arrowup")
    ) {

        aimY -=
            1;
    }


    if (
        down("k") ||
        down("arrowdown")
    ) {

        aimY +=
            1;
    }


    if (
        down("j") ||
        down("arrowleft")
    ) {

        aimX -=
            1;
    }


    if (
        down("l") ||
        down("arrowright")
    ) {

        aimX +=
            1;
    }


    const aimLength =
        Math.hypot(
            aimX,
            aimY
        );


    if (
        aimLength > 0
    ) {

        aimX /=
            aimLength;

        aimY /=
            aimLength;


        player.aimX =
            aimX;

        player.aimY =
            aimY;


        player.aimAngle =
            Math.atan2(
                aimY,
                aimX
            );
    }


    /* ==============================================
       MOVEMENT
    ============================================== */

    let moveX =
        0;

    let moveY =
        0;


    if (
        down("w")
    ) {

        moveY -=
            1;
    }


    if (
        down("s")
    ) {

        moveY +=
            1;
    }


    if (
        down("a")
    ) {

        moveX -=
            1;
    }


    if (
        down("d")
    ) {

        moveX +=
            1;
    }


    const moveLength =
        Math.hypot(
            moveX,
            moveY
        );


    if (
        moveLength > 0
    ) {

        moveX /=
            moveLength;

        moveY /=
            moveLength;


        player.dashX =
            moveX;

        player.dashY =
            moveY;
    }


    /* ==============================================
       COOLDOWNS
    ============================================== */

    if (
        player.fireCooldown > 0
    ) {

        player.fireCooldown -=
            delta;
    }


    if (
        player.dashCooldown > 0
    ) {

        player.dashCooldown -=
            delta;
    }


    /*
        Hold SPACE for continuous fire.
    */

    if (
        down(" ")
    ) {

        shoot();
    }


    /* ==============================================
       MOVEMENT
    ============================================== */

    let currentMoveSpeed =
        player.moveSpeed;


    /*
        Last Stand.
    */

    if (
        hasAbility(
            "lastStand"
        ) &&
        player.health === 1
    ) {

        currentMoveSpeed *=
            1.20;
    }


    if (
        player.dashTime > 0
    ) {

        player.dashTime -=
            delta;


        player.x +=
            player.dashX *
            player.dashSpeed *
            delta;


        player.y +=
            player.dashY *
            player.dashSpeed *
            delta;

    }

    else {

        player.x +=
            moveX *
            currentMoveSpeed *
            delta;


        player.y +=
            moveY *
            currentMoveSpeed *
            delta;
    }


    /*
        Arena boundaries.
    */

    player.x =
        Math.max(
            player.radius,
            Math.min(
                width -
                player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                height -
                player.radius,
                player.y
            )
        );


    /* ==============================================
       ENEMY SPAWNING
    ============================================== */

    spawnTimer -=
        delta;


    let spawnInterval =
        getEnemySpawnInterval();


    /*
        Quick Start affects only the
        first five seconds.
    */

    if (
        hasAbility(
            "quickStart"
        ) &&
        timeAlive < 5
    ) {

        spawnInterval *=
            1.25;
    }


    if (
        spawnTimer <= 0
    ) {

        spawnEnemy();


        spawnTimer =
            spawnInterval;
    }


    /* ==============================================
       ORB SPAWNING
    ============================================== */

    orbTimer -=
        delta;


    if (
        orbTimer <= 0
    ) {

        if (
            orbsOnMap.length < 3
        ) {

            spawnOrb();
        }


        /*
            Recalculate after every spawn
            so the orb rate follows the
            same difficulty curve as the
            enemies.
        */

        orbTimer =
            getOrbSpawnInterval();
    }


    /* ==============================================
       OBJECT UPDATES
    ============================================== */

    updateBullets(
        delta
    );


    updateEnemies(
        delta
    );


    updateOrbs(
        delta
    );


    updateParticles(
        delta
    );
}


/* ==================================================
   UPDATE BULLETS
================================================== */

function updateBullets(
    delta
) {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.dx *
            bullet.speed *
            delta;


        bullet.y +=
            bullet.dy *
            bullet.speed *
            delta;


        bullet.life -=
            delta;


        if (
            bullet.life <= 0 ||
            bullet.x < -60 ||
            bullet.x > width + 60 ||
            bullet.y < -60 ||
            bullet.y > height + 60
        ) {

            bullets.splice(
                i,
                1
            );


            continue;
        }


        for (
            let j =
                enemies.length - 1;

            j >= 0;

            j--
        ) {

            const enemy =
                enemies[j];


            if (
                distance(
                    bullet,
                    enemy
                ) <
                bullet.radius +
                enemy.radius
            ) {

                enemy.hp -=
                    bullet.damage;


                enemy.hitFlash =
                    0.08;


                makeParticles(
                    bullet.x,
                    bullet.y,
                    COLORS.white,
                    5,
                    150
                );


                bullets.splice(
                    i,
                    1
                );


                if (
                    enemy.hp <= 0
                ) {

                    score +=
                        enemy.points;


                    /*
                        Scavenger:
                        12% chance to spawn an
                        additional orb.
                    */

                    if (
                        hasAbility(
                            "scavenger"
                        ) &&
                        Math.random() < 0.12 &&
                        orbsOnMap.length < 5
                    ) {

                        spawnOrb();
                    }


                    makeParticles(
                        enemy.x,
                        enemy.y,
                        COLORS.red,
                        enemy.type === "tank"
                            ? 30
                            : 18,
                        220
                    );


                    screenShake =
                        Math.max(
                            screenShake,
                            enemy.type === "tank"
                                ? 6
                                : 3
                        );


                    enemies.splice(
                        j,
                        1
                    );
                }


                break;
            }
        }
    }
}


/* ==================================================
   UPDATE ENEMIES
================================================== */

function updateEnemies(
    delta
) {

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];


        const angle =
            Math.atan2(
                player.y -
                enemy.y,

                player.x -
                enemy.x
            );


        enemy.x +=
            Math.cos(angle) *
            enemy.speed *
            delta;


        enemy.y +=
            Math.sin(angle) *
            enemy.speed *
            delta;


        enemy.rotation +=
            delta *
            (
                enemy.type === "fast"
                    ? 4
                    : 2
            );


        enemy.hitFlash =
            Math.max(
                0,
                enemy.hitFlash -
                delta
            );


        if (
            distance(
                player,
                enemy
            ) <
            player.radius +
            enemy.radius
        ) {

            enemies.splice(
                i,
                1
            );


            /*
                Combat Training produces
                a defensive knockback.
            */

            if (
                hasAbility(
                    "combatTraining"
                )
            ) {

                const angleAway =
                    Math.atan2(
                        player.y -
                        enemy.y,

                        player.x -
                        enemy.x
                    );


                player.x +=
                    Math.cos(
                        angleAway
                    ) *
                    55;


                player.y +=
                    Math.sin(
                        angleAway
                    ) *
                    55;


                player.x =
                    Math.max(
                        player.radius,
                        Math.min(
                            width -
                            player.radius,
                            player.x
                        )
                    );


                player.y =
                    Math.max(
                        player.radius,
                        Math.min(
                            height -
                            player.radius,
                            player.y
                        )
                    );
            }


            damagePlayer();


            if (
                gameOver
            ) {

                return;
            }
        }
    }
}


/* ==================================================
   UPDATE ORBS
================================================== */

function updateOrbs(
    delta
) {

    /*
        Magnetic Core.
    */

    const magnetRadius =
        hasAbility(
            "magneticCore"
        )
            ? 85
            : 0;


    for (
        let i =
            orbsOnMap.length - 1;

        i >= 0;

        i--
    ) {

        const orb =
            orbsOnMap[i];


        orb.life -=
            delta;


        orb.pulse +=
            delta * 5;


        /*
            Magnetic attraction.
        */

        if (
            magnetRadius > 0
        ) {

            const dx =
                player.x -
                orb.x;


            const dy =
                player.y -
                orb.y;


            const distanceToPlayer =
                Math.hypot(
                    dx,
                    dy
                );


            if (
                distanceToPlayer > 0 &&
                distanceToPlayer < magnetRadius
            ) {

                const pull =
                    180 *
                    (
                        1 -
                        distanceToPlayer /
                        magnetRadius
                    );


                orb.x +=
                    dx /
                    distanceToPlayer *
                    pull *
                    delta;


                orb.y +=
                    dy /
                    distanceToPlayer *
                    pull *
                    delta;
            }
        }


        if (
            distance(
                player,
                orb
            ) <
            player.radius +
            orb.radius +
            5
        ) {

            /*
                Collector:

                Every fifth pickup is worth
                two orbs instead of one.
            */

            player.pickupCount +=
                1;


            let value =
                1;


            if (
                hasAbility(
                    "collector"
                ) &&
                player.pickupCount % 5 === 0
            ) {

                value =
                    2;
            }


            orbs +=
                value;


            makeParticles(
                orb.x,
                orb.y,
                COLORS.yellow,
                value === 2
                    ? 35
                    : 25,
                220
            );


            orbsOnMap.splice(
                i,
                1
            );

        }

        else if (
            orb.life <= 0
        ) {

            orbsOnMap.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   UPDATE PARTICLES
================================================== */

function updateParticles(
    delta
) {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            particles[i];


        particle.life -=
            delta;


        particle.x +=
            particle.dx *
            delta;


        particle.y +=
            particle.dy *
            delta;


        particle.dx *=
            Math.pow(
                0.05,
                delta
            );


        particle.dy *=
            Math.pow(
                0.05,
                delta
            );


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   END GAME
================================================== */

function endGame() {

    gameOver =
        true;


    if (
        score >
        highScore
    ) {

        highScore =
            score;


        try {

            localStorage.setItem(
                "neonEscapeHighScore",
                String(highScore)
            );

        }

        catch (error) {

            /*
                Storage failure must not
                break the game-over screen.
            */
        }
    }


    makeParticles(
        player.x,
        player.y,
        COLORS.red,
        55,
        300
    );


    screenShake =
        12;


    updateMessage();
}


/* ==================================================
   DRAW
================================================== */

function draw() {

    ctx.save();


    if (
        screenShake > 0
    ) {

        ctx.translate(

            (
                Math.random() -
                0.5
            ) *
            screenShake,


            (
                Math.random() -
                0.5
            ) *
            screenShake
        );
    }


    drawBackground();

    drawOrbs();

    drawEnemies();

    drawBullets();

    drawParticles();

    drawPlayer();

    drawUI();


    ctx.restore();
}


/* ==================================================
   BACKGROUND
================================================== */

function drawBackground() {

    ctx.fillStyle =
        COLORS.bg;


    ctx.fillRect(
        -20,
        -20,
        width + 40,
        height + 40
    );


    const grid =
        50;


    ctx.strokeStyle =
        COLORS.grid;


    ctx.lineWidth =
        1;


    for (
        let x = 0;

        x <= width;

        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();
    }


    for (
        let y = 0;

        y <= height;

        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }
}


/* ==================================================
   PLAYER
================================================== */

function drawPlayer() {

    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    ctx.rotate(
        player.aimAngle
    );


    /*
        Cannon.
    */

    ctx.shadowBlur =
        18;


    ctx.shadowColor =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    ctx.fillStyle =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    if (
        upgrades.scatter.level > 0
    ) {

        ctx.fillRect(
            0,
            -7,
            32,
            14
        );

    }

    else {

        ctx.fillRect(
            0,
            -4,
            32,
            8
        );
    }


    ctx.fillStyle =
        COLORS.white;


    ctx.fillRect(
        26,
        -5,
        8,
        10
    );


    /*
        Ship.
    */

    ctx.shadowBlur =
        25;


    ctx.shadowColor =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    ctx.fillStyle =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    ctx.beginPath();


    ctx.moveTo(
        20,
        0
    );


    ctx.lineTo(
        -12,
        -10
    );


    ctx.lineTo(
        -7,
        0
    );


    ctx.lineTo(
        -12,
        10
    );


    ctx.closePath();


    ctx.fill();


    /*
        Cockpit.
    */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        COLORS.bg;


    ctx.beginPath();


    ctx.moveTo(
        10,
        0
    );


    ctx.lineTo(
        -6,
        -5
    );


    ctx.lineTo(
        -3,
        0
    );


    ctx.lineTo(
        -6,
        5
    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();


    /*
        Dash indicator.
    */

    if (
        player.dashCooldown <= 0 &&
        !homeScreen &&
        !gameOver
    ) {

        ctx.strokeStyle =
            "rgba(0,255,255,.7)";


        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.arc(

            player.x,

            player.y,

            player.radius +
            8 +
            Math.sin(
                performance.now() /
                100
            ) *
            2,

            0,

            Math.PI * 2
        );


        ctx.stroke();
    }


    /*
        Emergency Shield indicator.
    */

    if (
        hasAbility(
            "emergencyShield"
        ) &&
        !player.emergencyShieldUsed &&
        !homeScreen &&
        !gameOver
    ) {

        ctx.strokeStyle =
            "rgba(102,204,255,.75)";


        ctx.lineWidth =
            1.5;


        ctx.beginPath();


        ctx.arc(

            player.x,

            player.y,

            player.radius +
            14,

            0,

            Math.PI * 2
        );


        ctx.stroke();
    }
}


/* ==================================================
   BULLETS
================================================== */

function drawBullets() {

    ctx.fillStyle =
        COLORS.white;


    ctx.shadowBlur =
        14;


    ctx.shadowColor =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.white;


    for (
        const bullet of bullets
    ) {

        ctx.beginPath();


        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }


    ctx.shadowBlur =
        0;
}


/* ==================================================
   ENEMIES
================================================== */

function drawEnemies() {

    for (
        const enemy of enemies
    ) {

        ctx.save();


        ctx.translate(
            enemy.x,
            enemy.y
        );


        ctx.rotate(
            enemy.rotation
        );


        ctx.shadowBlur =
            18;


        ctx.shadowColor =
            COLORS.red;


        ctx.fillStyle =
            enemy.hitFlash > 0
                ? COLORS.white
                : COLORS.red;


        if (
            enemy.type === "tank"
        ) {

            ctx.fillRect(
                -enemy.radius,
                -enemy.radius,
                enemy.radius * 2,
                enemy.radius * 2
            );


            ctx.fillStyle =
                COLORS.bg;


            ctx.fillRect(
                -7,
                -7,
                14,
                14
            );

        }

        else if (
            enemy.type === "fast"
        ) {

            ctx.beginPath();


            ctx.moveTo(
                enemy.radius,
                0
            );


            ctx.lineTo(
                -enemy.radius,
                -enemy.radius * 0.65
            );


            ctx.lineTo(
                -enemy.radius,
                enemy.radius * 0.65
            );


            ctx.closePath();


            ctx.fill();

        }

        else {

            ctx.beginPath();


            for (
                let i = 0;

                i < 8;

                i++
            ) {

                const angle =
                    i *
                    Math.PI /
                    4;


                const radius =
                    i % 2 === 0
                        ? enemy.radius
                        : enemy.radius * 0.45;


                const x =
                    Math.cos(angle) *
                    radius;


                const y =
                    Math.sin(angle) *
                    radius;


                if (
                    i === 0
                ) {

                    ctx.moveTo(
                        x,
                        y
                    );

                }

                else {

                    ctx.lineTo(
                        x,
                        y
                    );
                }
            }


            ctx.closePath();


            ctx.fill();
        }


        /*
            Tank health bar.
        */

        if (
            enemy.type === "tank"
        ) {

            const healthWidth =
                enemy.radius * 2;


            const healthRatio =
                Math.max(
                    0,
                    enemy.hp / 3
                );


            ctx.fillStyle =
                "rgba(255,255,255,.2)";


            ctx.fillRect(
                -enemy.radius,
                enemy.radius + 7,
                healthWidth,
                3
            );


            ctx.fillStyle =
                COLORS.white;


            ctx.fillRect(
                -enemy.radius,
                enemy.radius + 7,
                healthWidth *
                healthRatio,
                3
            );
        }


        ctx.restore();
    }
}


/* ==================================================
   ORBS
================================================== */

function drawOrbs() {

    for (
        const orb of orbsOnMap
    ) {

        const scale =
            1 +
            Math.sin(
                orb.pulse
            ) *
            0.25;


        ctx.save();


        ctx.translate(
            orb.x,
            orb.y
        );


        ctx.scale(
            scale,
            scale
        );


        ctx.shadowBlur =
            25;


        ctx.shadowColor =
            COLORS.yellow;


        ctx.fillStyle =
            COLORS.yellow;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            orb.radius,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();
    }
}


/* ==================================================
   PARTICLES
================================================== */

function drawParticles() {

    for (
        const particle of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life /
                particle.maxLife
            );


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            particle.x,
            particle.y,
            particle.size,
            particle.size
        );
    }


    ctx.globalAlpha =
        1;
}


/* ==================================================
   UI
================================================== */

function drawUI() {

    if (
        homeScreen
    ) {

        return;
    }


    ctx.shadowBlur =
        0;


    ctx.textAlign =
        "left";


    /* ----------------------------------------------
       SCORE
    ---------------------------------------------- */

    ctx.fillStyle =
        COLORS.white;


    ctx.font =
        "bold 20px Arial";


    ctx.fillText(
        `SCORE ${score}`,
        20,
        30
    );


    ctx.font =
        "14px Arial";


    ctx.fillText(
        `TIME ${timeAlive.toFixed(1)}s`,
        20,
        52
    );


    /* ----------------------------------------------
       HEALTH
    ---------------------------------------------- */

    ctx.fillStyle =
        COLORS.red;


    ctx.font =
        "bold 14px Arial";


    ctx.fillText(
        "HP",
        20,
        75
    );


    for (
        let i = 0;

        i < player.maxHealth;

        i++
    ) {

        ctx.fillStyle =
            i < player.health
                ? COLORS.red
                : "rgba(255,255,255,.15)";


        ctx.fillRect(
            50 + i * 18,
            65,
            13,
            10
        );
    }


    /* ----------------------------------------------
       ORBS
    ---------------------------------------------- */

    ctx.fillStyle =
        COLORS.yellow;


    ctx.font =
        "bold 15px Arial";


    ctx.fillText(
        `ORBS ${orbs}`,
        20,
        96
    );


    /* ----------------------------------------------
       RIGHT SIDE
    ---------------------------------------------- */

    ctx.textAlign =
        "right";


    ctx.fillStyle =
        COLORS.white;


    ctx.font =
        "14px Arial";


    ctx.fillText(
        `BEST ${highScore}`,
        width - 20,
        30
    );


    if (
        shopCooldown > 0
    ) {

        ctx.fillStyle =
            COLORS.red;


        ctx.fillText(
            `SHOP ${shopCooldown.toFixed(1)}s`,
            width - 20,
            52
        );

    }

    else if (
        shopReadyDelay > 0
    ) {

        ctx.fillStyle =
            "#888";


        ctx.fillText(
            "SHOP LOADING",
            width - 20,
            52
        );

    }

    else {

        ctx.fillStyle =
            COLORS.cyan;


        ctx.fillText(
            "SHOP READY",
            width - 20,
            52
        );
    }


    /* ----------------------------------------------
       DASH
    ---------------------------------------------- */

    const barWidth =
        120;


    const dashProgress =
        Math.max(
            0,
            1 -
            player.dashCooldown /
            player.dashMaxCooldown
        );


    ctx.textAlign =
        "left";


    ctx.fillStyle =
        "rgba(255,255,255,.16)";


    ctx.fillRect(
        20,
        height - 30,
        barWidth,
        7
    );


    ctx.fillStyle =
        COLORS.cyan;


    ctx.fillRect(
        20,
        height - 30,
        barWidth *
        dashProgress,
        7
    );


    /* ----------------------------------------------
       CONTROLS
    ---------------------------------------------- */

    ctx.font =
        "12px Arial";


    ctx.fillStyle =
        "rgba(255,255,255,.72)";


    ctx.fillText(
        "WASD MOVE   IJKL AIM   SPACE FIRE   SHIFT DASH   P SHOP",
        20,
        height - 40
    );


    ctx.textAlign =
        "right";


    ctx.fillText(
        "Yellow orbs = shop currency",
        width - 20,
        height - 20
    );


    ctx.textAlign =
        "left";
}


/* ==================================================
   MAIN GAME LOOP
================================================== */

function frame(now) {

    /*
        A zero delta on the first frame
        prevents a large jump when returning
        from the Home Screen.
    */

    const delta =
        lastTime === 0

            ? 0

            : Math.min(
                (now - lastTime) /
                1000,
                0.05
            );


    lastTime =
        now;


    update(
        delta
    );


    draw();


    requestAnimationFrame(
        frame
    );
}


/* ==================================================
   INITIALIZATION
================================================== */

resize();


/*
    The game intentionally starts
    on the Home Screen.

    The permanent ability loadout
    was loaded before this point.
*/

updateMessage();


requestAnimationFrame(
    frame
);

</script>
