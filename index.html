<body>

<canvas id="game"></canvas>

<div id="overlay">

<script>

"use strict";


/* ==================================================
   DOM
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");


/* ==================================================
   CANVAS
================================================== */

let width = 0;

let height = 0;

let dpr = 1;


function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        Math.max(
            1,
            window.innerWidth
        );


    height =
        Math.max(
            1,
            window.innerHeight
        );


    canvas.width =
        Math.floor(
            width * dpr
        );


    canvas.height =
        Math.floor(
            height * dpr
        );


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
        Don't overwrite a valid
        player position on resize.
    */

    if (
        !Number.isFinite(player.x) ||
        player.x === 0
    ) {

        player.x =
            width / 2;
    }


    if (
        !Number.isFinite(player.y) ||
        player.y === 0
    ) {

        player.y =
            height / 2;
    }
}


window.addEventListener(
    "resize",
    resize
);


/* ==================================================
   INPUT
================================================== */

const keys =
    Object.create(null);


function keyDown(event) {

    const key =
        event.key.toLowerCase();


    keys[key] =
        true;


    /*
        Prevent the browser from
        interpreting game keys as
        page commands.
    */

    const gameKeys = [

        "w",
        "a",
        "s",
        "d",

        "i",
        "j",
        "k",
        "l",

        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",

        " ",
        "shift",

        "p",
        "r",
        "h",

        "1",
        "2",
        "3",
        "4",
        "5",
        "6",

        "enter"
    ];


    if (
        gameKeys.includes(key)
    ) {

        event.preventDefault();
    }


    /*
        Ignore keyboard auto-repeat
        for actions that should only
        happen once per press.
    */

    if (
        event.repeat
    ) {

        return;
    }


    /* ------------------------------------------
       HOME SCREEN
    ------------------------------------------ */

    if (
        homeScreen
    ) {

        if (
            key === "enter" ||
            key === " "
        ) {

            startRound();
        }


        return;
    }


    /* ------------------------------------------
       SHOP
    ------------------------------------------ */

    if (
        key === "p" &&
        !gameOver
    ) {

        toggleShop();

        return;
    }


    /* ------------------------------------------
       GAME OVER
    ------------------------------------------ */

    if (
        gameOver
    ) {

        if (
            key === "r"
        ) {

            restart();

        }

        else if (
            key === "h"
        ) {

            goHome();
        }


        return;
    }


    /* ------------------------------------------
       GAMEPLAY
    ------------------------------------------ */

    if (
        key === " "
    ) {

        shoot();

    }

    else if (
        key === "shift"
    ) {

        dash();
    }


    /* ------------------------------------------
       SHOP NUMBER SHORTCUTS
    ------------------------------------------ */

    if (
        paused &&
        ["1","2","3","4","5","6"].includes(key)
    ) {

        const upgradeByKey = {

            "1": "rapid",

            "2": "heavy",

            "3": "thrusters",

            "4": "overdrive",

            "5": "repair",

            "6": "scatter"
        };


        buyUpgrade(
            upgradeByKey[key]
        );
    }
}


window.addEventListener(
    "keydown",
    keyDown
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[
            event.key.toLowerCase()
        ] = false;
    }
);


/*
    Prevent keys getting stuck
    if the browser loses focus.
*/

window.addEventListener(
    "blur",
    function() {

        for (
            const key in keys
        ) {

            keys[key] = false;
        }
    }
);


/*
    Hide the page's default
    behavior while the game is
    being played.
*/

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden &&
            !gameOver &&
            !homeScreen
        ) {

            paused = true;

            updateMessage();
        }
    }
);


/* ==================================================
   GAME STATE
================================================== */

let paused = false;

let gameOver = false;

let homeScreen = true;

let score = 0;

let orbs = 0;

let timeAlive = 0;

let spawnTimer = 0;

let orbTimer = 1.5;

let shopCooldown = 0;

let shopReadyDelay = 1.5;

let screenShake = 0;

let lastTime = 0;


const SHOP_COOLDOWN_TIME =
    10;


/* ==================================================
   OBJECT ARRAYS
================================================== */

const bullets = [];

const enemies = [];

const orbsOnMap = [];

const particles = [];


/* ==================================================
   COLORS
================================================== */

const COLORS = {

    bg:
        "#05050a",

    grid:
        "rgba(0,255,255,0.07)",

    cyan:
        "#00ffff",

    red:
        "#ff1744",

    yellow:
        "#ffe600",

    white:
        "#ffffff",

    scatter:
        "#ff66cc"
};


/* ==================================================
   HIGH SCORE
================================================== */

let highScore = 0;


try {

    highScore =
        Number(
            localStorage.getItem(
                "neonEscapeHighScore"
            )
        ) || 0;

}

catch (error) {

    highScore = 0;
}


/* ==================================================
   PLAYER
================================================== */

const player = {

    x: 0,

    y: 0,

    radius: 14,

    moveSpeed: 300,

    aimAngle: 0,

    aimX: 1,

    aimY: 0,

    fireCooldown: 0,

    fireRate: 0.16,

    bulletSpeed: 850,

    bulletDamage: 1,

    dashCooldown: 0,

    dashMaxCooldown: 1.1,

    dashTime: 0,

    dashDuration: 0.12,

    dashSpeed: 1000,

    dashX: 1,

    dashY: 0,

    maxHealth: 3,

    health: 3
};


/* ==================================================
   SHOP UPGRADES
================================================== */

const upgrades = {

    rapid: {

        level: 0,

        maxLevel: 3,

        cost: 3
    },


    heavy: {

        level: 0,

        maxLevel: 2,

        cost: 5
    },


    thrusters: {

        level: 0,

        maxLevel: 3,

        cost: 4
    },


    overdrive: {

        level: 0,

        maxLevel: 2,

        cost: 6
    },


    /*
        Scatter Cannon.

        One level only because it changes
        the weapon itself rather than being
        a conventional stat increase.
    */

    scatter: {

        level: 0,

        maxLevel: 1,

        cost: 12
    }
};


/* ==================================================
   INPUT HELPER
================================================== */

function down(key) {

    return keys[key] === true;
}


/* ==================================================
   DISTANCE
================================================== */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* ==================================================
   APPLY UPGRADES
================================================== */

function applyUpgrades() {

    /*
        Rapid Fire:
        20% shorter delay per level.
    */

    player.fireRate =
        0.16 *
        Math.pow(
            0.8,
            upgrades.rapid.level
        );


    /*
        Heavy Cannon:
        increases the base damage.

        Scatter Cannon uses half of this
        value for each pellet, keeping
        the pellets individually weak.
    */

    player.bulletDamage =
        1 +
        upgrades.heavy.level;


    /*
        Thrusters.
    */

    player.moveSpeed =
        300 *
        (
            1 +
            upgrades.thrusters.level *
            0.15
        );


    /*
        Overdrive.
    */

    player.dashMaxCooldown =
        1.1 *
        Math.pow(
            0.8,
            upgrades.overdrive.level
        );
}


/* ==================================================
   RESET UPGRADES
================================================== */

function resetUpgrades() {

    for (
        const upgrade of
        Object.values(upgrades)
    ) {

        upgrade.level = 0;
    }


    applyUpgrades();
}


/* ==================================================
   CLEAR OBJECTS
================================================== */

function clearRoundObjects() {

    bullets.length = 0;

    enemies.length = 0;

    orbsOnMap.length = 0;

    particles.length = 0;
}


/* ==================================================
   RESET PLAYER
================================================== */

function resetPlayer() {

    player.x =
        width / 2;


    player.y =
        height / 2;


    player.health =
        player.maxHealth;


    player.fireCooldown =
        0;


    player.dashCooldown =
        0;


    player.dashTime =
        0;


    player.aimAngle =
        0;


    player.aimX =
        1;


    player.aimY =
        0;


    player.dashX =
        1;


    player.dashY =
        0;
}


/* ==================================================
   START ROUND
================================================== */

function startRound() {

    homeScreen =
        false;


    paused =
        false;


    gameOver =
        false;


    score =
        0;


    orbs =
        0;


    timeAlive =
        0;


    spawnTimer =
        0.25;


    orbTimer =
        1.5;


    shopCooldown =
        0;


    shopReadyDelay =
        1.5;


    screenShake =
        0;


    /*
        Reset the animation timer.

        This prevents a large delta time
        if the player spent a long time
        on the home screen.
    */

    lastTime =
        0;


    clearRoundObjects();

    resetPlayer();

    resetUpgrades();

    updateMessage();
}


/* ==================================================
   RESTART
================================================== */

function restart() {

    startRound();
}


/* ==================================================
   RETURN HOME
================================================== */

function goHome() {

    homeScreen =
        true;


    paused =
        false;


    gameOver =
        false;


    lastTime =
        0;


    clearRoundObjects();

    updateMessage();
}


/* ==================================================
   SHOP TOGGLE
================================================== */

function toggleShop() {

    if (
        gameOver ||
        homeScreen
    ) {

        return;
    }


    /*
        Closing the shop is always
        allowed.

        This prevents the cooldown
        from trapping the player inside.
    */

    if (
        paused
    ) {

        paused =
            false;


        updateMessage();

        return;
    }


    /*
        Opening is subject to cooldown.
    */

    if (
        shopCooldown > 0 ||
        shopReadyDelay > 0
    ) {

        return;
    }


    paused =
        true;


    /*
        The cooldown starts when
        the shop is opened.
    */

    shopCooldown =
        SHOP_COOLDOWN_TIME;


    updateShopMessage();
}


/* ==================================================
   SHOP ITEM HTML
================================================== */

function upgradeHTML(
    id,
    name,
    description,
    color
) {

    const upgrade =
        upgrades[id];


    const maxed =
        upgrade.level >=
        upgrade.maxLevel;


    const canBuy =
        orbs >=
        upgrade.cost &&
        !maxed;


    return `

        <div class="shop-item">

            <h3 style="color:${color}">
                ${name}
            </h3>

            <p>

                ${description}

                <br>

                Level:
                ${upgrade.level}/${upgrade.maxLevel}

            </p>

            <button
                onclick="buyUpgrade('${id}')"
                ${canBuy ? "" : "disabled"}
            >

                ${
                    maxed

                        ? "MAXED"

                        : `BUY — ${upgrade.cost} ORBS`
                }

            </button>

        </div>
    `;
}


/* ==================================================
   SHOP UI
================================================== */

function updateShopMessage() {

    const cooldownText =
        shopCooldown > 0

            ? `<span style="color:#ff1744">
                Shop cooldown:
                ${shopCooldown.toFixed(1)}s
               </span>`

            : "Shop ready after cooldown.";


    message.innerHTML = `

        <h1 style="color:#00ffff">
            ARMORY
        </h1>


        <p>
            Spend yellow orbs on temporary upgrades.
            All upgrades reset when the round ends.
        </p>


        <p style="
            color:#ffe600;
            font-weight:bold;
            font-size:20px;
        ">

            ORBS: ${orbs}

        </p>


        <div class="shop-grid">

            ${upgradeHTML(
                "rapid",
                "RAPID FIRE",
                "20% less cannon delay per level.",
                COLORS.cyan
            )}


            ${upgradeHTML(
                "heavy",
                "HEAVY CANNON",
                "+1 normal-cannon damage per level. Scatter pellets also benefit, but remain individually weak.",
                "#ff7b00"
            )}


            ${upgradeHTML(
                "thrusters",
                "THRUSTERS",
                "+15% movement speed per level.",
                "#00ff88"
            )}


            ${upgradeHTML(
                "overdrive",
                "OVERDRIVE",
                "20% less dash cooldown per level.",
                "#a66cff"
            )}


            <div class="shop-item">

                <h3 style="color:#ff5555">
                    REPAIR
                </h3>


                <p>

                    Restore one health point.

                    <br>

                    Health:
                    ${player.health}/${player.maxHealth}

                </p>


                <button
                    onclick="buyUpgrade('repair')"
                    ${
                        orbs >= 2 &&
                        player.health <
                        player.maxHealth

                            ? ""

                            : "disabled"
                    }
                >

                    ${
                        player.health >=
                        player.maxHealth

                            ? "FULL HEALTH"

                            : "BUY — 2 ORBS"
                    }

                </button>

            </div>


            ${upgradeHTML(
                "scatter",
                "SCATTER CANNON",
                "Replaces the cannon with 7 low-damage pellets fired in a wide cone. Extremely high coverage. Each pellet deals half normal damage.",
                COLORS.scatter
            )}

        </div>


        <p style="
            font-size:13px;
            color:#888;
        ">

            Press P to close.

            ${cooldownText}

            <br><br>

            Keys:

            1 Rapid ·
            2 Heavy ·
            3 Thrusters ·
            4 Overdrive ·
            5 Repair ·
            6 Scatter

        </p>
    `;


    message.classList.add(
        "show"
    );
}


/* ==================================================
   BUY UPGRADE
================================================== */

function buyUpgrade(id) {

    if (
        !paused ||
        gameOver ||
        homeScreen
    ) {

        return;
    }


    /*
        Repair is special because it
        has no level.
    */

    if (
        id === "repair"
    ) {

        if (
            orbs >= 2 &&
            player.health <
            player.maxHealth
        ) {

            orbs -=
                2;


            player.health +=
                1;


            makeParticles(
                player.x,
                player.y,
                COLORS.cyan,
                18,
                180
            );


            updateShopMessage();
        }


        return;
    }


    const upgrade =
        upgrades[id];


    /*
        Defensive check against
        invalid shop IDs.
    */

    if (
        !upgrade
    ) {

        return;
    }


    if (
        upgrade.level >=
        upgrade.maxLevel
    ) {

        return;
    }


    if (
        orbs <
        upgrade.cost
    ) {

        return;
    }


    orbs -=
        upgrade.cost;


    upgrade.level +=
        1;


    applyUpgrades();


    makeParticles(
        player.x,
        player.y,
        COLORS.yellow,
        18,
        180
    );


    updateShopMessage();
}


window.buyUpgrade =
    buyUpgrade;

window.startRound =
    startRound;

window.restart =
    restart;

window.goHome =
    goHome;


/* ==================================================
   MAIN MESSAGE
================================================== */

function updateMessage() {

    /*
        HOME
    */

    if (
        homeScreen
    ) {

        message.innerHTML = `

            <h1 style="color:#00ffff">
                NEON ESCAPE
            </h1>


            <p>
                Survive as long as possible,
                destroy enemies, collect yellow
                orbs and spend them in the Armory.
            </p>


            <button
                class="main-button"
                onclick="startRound()"
            >

                PLAY ROUND

            </button>


            <p style="
                font-size:13px;
                color:#888;
            ">

                Keyboard:
                press ENTER or SPACE to play.

            </p>
        `;


        message.classList.add(
            "show"
        );


        return;
    }


    /*
        GAME OVER
    */

    if (
        gameOver
    ) {

        message.innerHTML = `

            <h1 style="color:#ff1744">
                GAME OVER
            </h1>


            <p>
                Score:
                <strong>
                    ${score}
                </strong>
            </p>


            <p>
                Best:
                <strong>
                    ${highScore}
                </strong>
            </p>


            <p>
                Orbs collected:
                <strong>
                    ${orbs}
                </strong>
            </p>


            <button
                class="main-button"
                onclick="restart()"
            >

                PLAY AGAIN

            </button>


            <button
                class="main-button secondary-button"
                onclick="goHome()"
            >

                HOME

            </button>


            <p style="
                font-size:13px;
                color:#888;
            ">

                Press R to play again
                or H for Home.

            </p>
        `;


        message.classList.add(
            "show"
        );


        return;
    }


    /*
        SHOP
    */

    if (
        paused
    ) {

        updateShopMessage();

        return;
    }


    /*
        NORMAL GAMEPLAY
    */

    message.classList.remove(
        "show"
    );
}


/* ==================================================
   RANDOM EDGE POSITION
================================================== */

function randomEdgePosition(
    margin = 50
) {

    const side =
        Math.floor(
            Math.random() * 4
        );


    if (
        side === 0
    ) {

        return {

            x:
                Math.random() *
                width,

            y:
                -margin
        };
    }


    if (
        side === 1
    ) {

        return {

            x:
                width + margin,

            y:
                Math.random() *
                height
        };
    }


    if (
        side === 2
    ) {

        return {

            x:
                Math.random() *
                width,

            y:
                height + margin
        };
    }


    return {

        x:
            -margin,

        y:
            Math.random() *
            height
    };
}


/* ==================================================
   SPAWN ENEMY
================================================== */

function spawnEnemy() {

    const position =
        randomEdgePosition();


    const difficulty =
        1 +
        timeAlive / 30;


    const roll =
        Math.random();


    let type =
        "normal";


    if (
        timeAlive > 20 &&
        roll < 0.20
    ) {

        type =
            "fast";
    }


    if (
        timeAlive > 45 &&
        roll > 0.82
    ) {

        type =
            "tank";
    }


    const enemy = {

        x:
            position.x,

        y:
            position.y,

        rotation:
            Math.random() *
            Math.PI *
            2,

        type:
            type,

        hitFlash:
            0
    };


    if (
        type === "fast"
    ) {

        enemy.radius =
            9;

        enemy.speed =
            115 *
            difficulty;

        enemy.hp =
            1;

        enemy.points =
            150;

    }

    else if (
        type === "tank"
    ) {

        enemy.radius =
            22;

        enemy.speed =
            42 *
            difficulty;

        enemy.hp =
            3;

        enemy.points =
            400;

    }

    else {

        enemy.radius =
            14;

        enemy.speed =
            62 *
            difficulty;

        enemy.hp =
            1;

        enemy.points =
            100;
    }


    enemies.push(
        enemy
    );
}


/* ==================================================
   SPAWN ORB
================================================== */

function spawnOrb() {

    const padding =
        70;


    orbsOnMap.push({

        x:
            padding +
            Math.random() *
            Math.max(
                1,
                width -
                padding * 2
            ),


        y:
            padding +
            Math.random() *
            Math.max(
                1,
                height -
                padding * 2
            ),


        radius:
            7,


        pulse:
            Math.random() *
            Math.PI *
            2,


        life:
            8
    });
}


/* ==================================================
   PARTICLES
================================================== */

function makeParticles(
    x,
    y,
    color,
    amount = 10,
    speed = 150
) {

    for (
        let i = 0;

        i < amount;

        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const velocity =
            speed *
            (
                0.3 +
                Math.random() *
                0.7
            );


        particles.push({

            x:
                x,

            y:
                y,

            dx:
                Math.cos(angle) *
                velocity,

            dy:
                Math.sin(angle) *
                velocity,

            life:
                0.3 +
                Math.random() *
                0.5,

            maxLife:
                0.8,

            size:
                1.5 +
                Math.random() *
                3,

            color:
                color
        });
    }
}


/* ==================================================
   FIRE ONE BULLET
================================================== */

function fireBullet(
    angle,
    damage
) {

    const muzzle =
        31;


    const x =
        player.x +
        Math.cos(angle) *
        muzzle;


    const y =
        player.y +
        Math.sin(angle) *
        muzzle;


    bullets.push({

        x:
            x,

        y:
            y,

        dx:
            Math.cos(angle),

        dy:
            Math.sin(angle),

        radius:
            4,

        speed:
            player.bulletSpeed,

        damage:
            damage,

        life:
            1.25
    });


    return {

        x:
            x,

        y:
            y
    };
}


/* ==================================================
   SHOOT
================================================== */

function shoot() {

    if (
        gameOver ||
        paused ||
        homeScreen ||
        player.fireCooldown > 0
    ) {

        return;
    }


    /*
        SCATTER CANNON

        Seven pellets spread over
        roughly 41 degrees.

        Each pellet does half the
        normal cannon damage.
    */

    if (
        upgrades.scatter.level > 0
    ) {

        const pelletCount =
            7;


        const spread =
            0.72;


        for (
            let i = 0;

            i < pelletCount;

            i++
        ) {

            /*
                This gives the pellets
                evenly spaced positions
                from -spread/2 to +spread/2.
            */

            const t =
                i /
                (pelletCount - 1);


            const angle =
                player.aimAngle +
                (
                    t - 0.5
                ) *
                spread;


            const pelletDamage =
                player.bulletDamage *
                0.5;


            fireBullet(
                angle,
                pelletDamage
            );
        }


        const muzzle =
            31;


        makeParticles(

            player.x +
            Math.cos(
                player.aimAngle
            ) *
            muzzle,


            player.y +
            Math.sin(
                player.aimAngle
            ) *
            muzzle,


            COLORS.scatter,

            18,

            260
        );

    }

    else {

        /*
            Normal single-shot cannon.
        */

        const muzzle =
            fireBullet(
                player.aimAngle,
                player.bulletDamage
            );


        makeParticles(
            muzzle.x,
            muzzle.y,
            COLORS.white,
            8,
            220
        );
    }


    /*
        Rapid Fire affects both weapons.
    */

    player.fireCooldown =
        player.fireRate;


    screenShake =
        Math.max(
            screenShake,
            upgrades.scatter.level > 0
                ? 3
                : 2
        );
}


/* ==================================================
   DASH
================================================== */

function dash() {

    if (
        gameOver ||
        paused ||
        homeScreen ||
        player.dashCooldown > 0
    ) {

        return;
    }


    let dx = 0;

    let dy = 0;


    if (
        down("w") ||
        down("arrowup")
    ) {

        dy -= 1;
    }


    if (
        down("s") ||
        down("arrowdown")
    ) {

        dy += 1;
    }


    if (
        down("a") ||
        down("arrowleft")
    ) {

        dx -= 1;
    }


    if (
        down("d") ||
        down("arrowright")
    ) {

        dx += 1;
    }


    const length =
        Math.hypot(
            dx,
            dy
        );


    if (
        length > 0
    ) {

        dx /=
            length;


        dy /=
            length;

    }

    else {

        dx =
            player.dashX;


        dy =
            player.dashY;
    }


    player.dashX =
        dx;


    player.dashY =
        dy;


    player.dashTime =
        player.dashDuration;


    player.dashCooldown =
        player.dashMaxCooldown;


    makeParticles(
        player.x,
        player.y,
        COLORS.cyan,
        25,
        260
    );
}


/* ==================================================
   DAMAGE PLAYER
================================================== */

function damagePlayer() {

    player.health -=
        1;


    makeParticles(
        player.x,
        player.y,
        COLORS.red,
        30,
        250
    );


    screenShake =
        10;


    if (
        player.health <= 0
    ) {

        endGame();
    }
}


/* ==================================================
   UPDATE
================================================== */

function update(delta) {

    /*
        Shop cooldown is intentionally
        updated even while the shop is open.

        The player therefore cannot open,
        close and immediately reopen it
        to exploit the pause system.
    */

    if (
        shopCooldown > 0
    ) {

        shopCooldown =
            Math.max(
                0,
                shopCooldown -
                delta
            );
    }


    if (
        shopReadyDelay > 0
    ) {

        shopReadyDelay =
            Math.max(
                0,
                shopReadyDelay -
                delta
            );
    }


    /*
        No gameplay simulation on
        the Home Screen, in the Shop,
        or after death.
    */

    if (
        paused ||
        gameOver ||
        homeScreen
    ) {

        updateParticles(
            delta
        );


        return;
    }


    timeAlive +=
        delta;


    /*
        Survival score.

        Math.max prevents the
        survival score from erasing
        enemy-kill points.
    */

    score =
        Math.max(
            score,
            Math.floor(
                timeAlive * 10
            )
        );


    screenShake =
        Math.max(
            0,
            screenShake -
            delta * 12
        );


    /* ----------------------------------------------
       AIM
    ---------------------------------------------- */

    let aimX = 0;

    let aimY = 0;


    if (
        down("i") ||
        down("arrowup")
    ) {

        aimY -= 1;
    }


    if (
        down("k") ||
        down("arrowdown")
    ) {

        aimY += 1;
    }


    if (
        down("j") ||
        down("arrowleft")
    ) {

        aimX -= 1;
    }


    if (
        down("l") ||
        down("arrowright")
    ) {

        aimX += 1;
    }


    const aimLength =
        Math.hypot(
            aimX,
            aimY
        );


    if (
        aimLength > 0
    ) {

        aimX /=
            aimLength;


        aimY /=
            aimLength;


        player.aimX =
            aimX;


        player.aimY =
            aimY;


        player.aimAngle =
            Math.atan2(
                aimY,
                aimX
            );
    }


    /* ----------------------------------------------
       MOVEMENT
    ---------------------------------------------- */

    let moveX = 0;

    let moveY = 0;


    if (
        down("w")
    ) {

        moveY -= 1;
    }


    if (
        down("s")
    ) {

        moveY += 1;
    }


    if (
        down("a")
    ) {

        moveX -= 1;
    }


    if (
        down("d")
    ) {

        moveX += 1;
    }


    const moveLength =
        Math.hypot(
            moveX,
            moveY
        );


    if (
        moveLength > 0
    ) {

        moveX /=
            moveLength;


        moveY /=
            moveLength;


        player.dashX =
            moveX;


        player.dashY =
            moveY;
    }


    /* ----------------------------------------------
       COOLDOWNS
    ---------------------------------------------- */

    if (
        player.fireCooldown > 0
    ) {

        player.fireCooldown -=
            delta;
    }


    if (
        player.dashCooldown > 0
    ) {

        player.dashCooldown -=
            delta;
    }


    /*
        Holding Space automatically
        fires when the weapon cooldown
        reaches zero.
    */

    if (
        down(" ")
    ) {

        shoot();
    }


    /* ----------------------------------------------
       MOVEMENT
    ---------------------------------------------- */

    if (
        player.dashTime > 0
    ) {

        player.dashTime -=
            delta;


        player.x +=
            player.dashX *
            player.dashSpeed *
            delta;


        player.y +=
            player.dashY *
            player.dashSpeed *
            delta;

    }

    else {

        player.x +=
            moveX *
            player.moveSpeed *
            delta;


        player.y +=
            moveY *
            player.moveSpeed *
            delta;
    }


    /*
        Keep player inside the arena.
    */

    player.x =
        Math.max(
            player.radius,
            Math.min(
                width -
                player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                height -
                player.radius,
                player.y
            )
        );


    /* ----------------------------------------------
       ENEMY SPAWNING
    ---------------------------------------------- */

    spawnTimer -=
        delta;


    const spawnInterval =
        Math.max(
            0.16,
            1 -
            timeAlive *
            0.009
        );


    if (
        spawnTimer <= 0
    ) {

        spawnEnemy();


        spawnTimer =
            spawnInterval;
    }


    /* ----------------------------------------------
       ORB SPAWNING
    ---------------------------------------------- */

    orbTimer -=
        delta;


    if (
        orbTimer <= 0
    ) {

        if (
            orbsOnMap.length < 3
        ) {

            spawnOrb();
        }


        orbTimer =
            2.5;
    }


    /* ----------------------------------------------
       OBJECT UPDATES
    ---------------------------------------------- */

    updateBullets(
        delta
    );


    updateEnemies(
        delta
    );


    updateOrbs(
        delta
    );


    updateParticles(
        delta
    );
}


/* ==================================================
   UPDATE BULLETS
================================================== */

function updateBullets(
    delta
) {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.dx *
            bullet.speed *
            delta;


        bullet.y +=
            bullet.dy *
            bullet.speed *
            delta;


        bullet.life -=
            delta;


        if (
            bullet.life <= 0 ||
            bullet.x < -60 ||
            bullet.x > width + 60 ||
            bullet.y < -60 ||
            bullet.y > height + 60
        ) {

            bullets.splice(
                i,
                1
            );


            continue;
        }


        /*
            Collision test.

            A bullet can hit only one
            enemy before disappearing.
        */

        for (
            let j =
                enemies.length - 1;

            j >= 0;

            j--
        ) {

            const enemy =
                enemies[j];


            if (
                distance(
                    bullet,
                    enemy
                ) <
                bullet.radius +
                enemy.radius
            ) {

                enemy.hp -=
                    bullet.damage;


                enemy.hitFlash =
                    0.08;


                makeParticles(
                    bullet.x,
                    bullet.y,
                    COLORS.white,
                    5,
                    150
                );


                bullets.splice(
                    i,
                    1
                );


                if (
                    enemy.hp <= 0
                ) {

                    score +=
                        enemy.points;


                    makeParticles(
                        enemy.x,
                        enemy.y,
                        COLORS.red,
                        enemy.type === "tank"
                            ? 30
                            : 18,
                        220
                    );


                    screenShake =
                        Math.max(
                            screenShake,
                            enemy.type === "tank"
                                ? 6
                                : 3
                        );


                    enemies.splice(
                        j,
                        1
                    );
                }


                break;
            }
        }
    }
}


/* ==================================================
   UPDATE ENEMIES
================================================== */

function updateEnemies(
    delta
) {

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];


        const angle =
            Math.atan2(
                player.y -
                enemy.y,

                player.x -
                enemy.x
            );


        enemy.x +=
            Math.cos(angle) *
            enemy.speed *
            delta;


        enemy.y +=
            Math.sin(angle) *
            enemy.speed *
            delta;


        enemy.rotation +=
            delta *
            (
                enemy.type === "fast"
                    ? 4
                    : 2
            );


        enemy.hitFlash =
            Math.max(
                0,
                enemy.hitFlash -
                delta
            );


        if (
            distance(
                player,
                enemy
            ) <
            player.radius +
            enemy.radius
        ) {

            enemies.splice(
                i,
                1
            );


            damagePlayer();


            if (
                gameOver
            ) {

                return;
            }
        }
    }
}


/* ==================================================
   UPDATE ORBS
================================================== */

function updateOrbs(
    delta
) {

    for (
        let i =
            orbsOnMap.length - 1;

        i >= 0;

        i--
    ) {

        const orb =
            orbsOnMap[i];


        orb.life -=
            delta;


        orb.pulse +=
            delta * 5;


        if (
            distance(
                player,
                orb
            ) <
            player.radius +
            orb.radius +
            5
        ) {

            orbs +=
                1;


            makeParticles(
                orb.x,
                orb.y,
                COLORS.yellow,
                25,
                220
            );


            orbsOnMap.splice(
                i,
                1
            );

        }

        else if (
            orb.life <= 0
        ) {

            orbsOnMap.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   UPDATE PARTICLES
================================================== */

function updateParticles(
    delta
) {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            particles[i];


        particle.life -=
            delta;


        particle.x +=
            particle.dx *
            delta;


        particle.y +=
            particle.dy *
            delta;


        particle.dx *=
            Math.pow(
                0.05,
                delta
            );


        particle.dy *=
            Math.pow(
                0.05,
                delta
            );


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   END GAME
================================================== */

function endGame() {

    gameOver =
        true;


    if (
        score >
        highScore
    ) {

        highScore =
            score;


        try {

            localStorage.setItem(
                "neonEscapeHighScore",
                String(highScore)
            );

        }

        catch (error) {

            /*
                Storage errors are ignored
                rather than crashing the game.
            */
        }
    }


    makeParticles(
        player.x,
        player.y,
        COLORS.red,
        55,
        300
    );


    screenShake =
        12;


    updateMessage();
}


/* ==================================================
   DRAW
================================================== */

function draw() {

    ctx.save();


    if (
        screenShake > 0
    ) {

        ctx.translate(

            (
                Math.random() -
                0.5
            ) *
            screenShake,


            (
                Math.random() -
                0.5
            ) *
            screenShake
        );
    }


    drawBackground();

    drawOrbs();

    drawEnemies();

    drawBullets();

    drawParticles();

    drawPlayer();

    drawUI();


    ctx.restore();
}


/* ==================================================
   DRAW BACKGROUND
================================================== */

function drawBackground() {

    ctx.fillStyle =
        COLORS.bg;


    ctx.fillRect(
        -20,
        -20,
        width + 40,
        height + 40
    );


    const grid =
        50;


    ctx.strokeStyle =
        COLORS.grid;


    ctx.lineWidth =
        1;


    for (
        let x = 0;

        x <= width;

        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();
    }


    for (
        let y = 0;

        y <= height;

        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }
}


/* ==================================================
   DRAW PLAYER
================================================== */

function drawPlayer() {

    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    ctx.rotate(
        player.aimAngle
    );


    /*
        Cannon barrel.
    */

    ctx.shadowBlur =
        18;


    ctx.shadowColor =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    ctx.fillStyle =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    /*
        Scatter cannon has a
        visually wider muzzle.
    */

    if (
        upgrades.scatter.level > 0
    ) {

        ctx.fillRect(
            0,
            -7,
            32,
            14
        );

    }

    else {

        ctx.fillRect(
            0,
            -4,
            32,
            8
        );
    }


    ctx.fillStyle =
        COLORS.white;


    ctx.fillRect(
        26,
        -5,
        8,
        10
    );


    /*
        Ship body.
    */

    ctx.shadowBlur =
        25;


    ctx.shadowColor =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    ctx.fillStyle =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.cyan;


    ctx.beginPath();

    ctx.moveTo(
        20,
        0
    );

    ctx.lineTo(
        -12,
        -10
    );

    ctx.lineTo(
        -7,
        0
    );

    ctx.lineTo(
        -12,
        10
    );

    ctx.closePath();

    ctx.fill();


    /*
        Inner cockpit.
    */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        COLORS.bg;


    ctx.beginPath();

    ctx.moveTo(
        10,
        0
    );

    ctx.lineTo(
        -6,
        -5
    );

    ctx.lineTo(
        -3,
        0
    );

    ctx.lineTo(
        -6,
        5
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();


    /*
        Dash-ready indicator.
    */

    if (
        player.dashCooldown <= 0 &&
        !homeScreen &&
        !gameOver
    ) {

        ctx.strokeStyle =
            "rgba(0,255,255,.7)";


        ctx.lineWidth =
            2;


        ctx.beginPath();


        ctx.arc(

            player.x,

            player.y,

            player.radius +
            8 +
            Math.sin(
                performance.now() /
                100
            ) *
            2,

            0,

            Math.PI * 2
        );


        ctx.stroke();
    }
}


/* ==================================================
   DRAW BULLETS
================================================== */

function drawBullets() {

    ctx.fillStyle =
        COLORS.white;


    ctx.shadowBlur =
        14;


    /*
        Scatter pellets use pink glow
        so the player can immediately
        distinguish the weapon.
    */

    ctx.shadowColor =
        upgrades.scatter.level > 0
            ? COLORS.scatter
            : COLORS.white;


    for (
        const bullet of bullets
    ) {

        ctx.beginPath();


        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );


        ctx.fill();
    }


    ctx.shadowBlur =
        0;
}


/* ==================================================
   DRAW ENEMIES
================================================== */

function drawEnemies() {

    for (
        const enemy of enemies
    ) {

        ctx.save();


        ctx.translate(
            enemy.x,
            enemy.y
        );


        ctx.rotate(
            enemy.rotation
        );


        ctx.shadowBlur =
            18;


        ctx.shadowColor =
            COLORS.red;


        ctx.fillStyle =
            enemy.hitFlash > 0
                ? COLORS.white
                : COLORS.red;


        /*
            Tank.
        */

        if (
            enemy.type === "tank"
        ) {

            ctx.fillRect(
                -enemy.radius,
                -enemy.radius,
                enemy.radius * 2,
                enemy.radius * 2
            );


            ctx.fillStyle =
                COLORS.bg;


            ctx.fillRect(
                -7,
                -7,
                14,
                14
            );
        }


        /*
            Fast enemy.
        */

        else if (
            enemy.type === "fast"
        ) {

            ctx.beginPath();


            ctx.moveTo(
                enemy.radius,
                0
            );


            ctx.lineTo(
                -enemy.radius,
                -enemy.radius * 0.65
            );


            ctx.lineTo(
                -enemy.radius,
                enemy.radius * 0.65
            );


            ctx.closePath();


            ctx.fill();
        }


        /*
            Normal enemy.
        */

        else {

            ctx.beginPath();


            for (
                let i = 0;

                i < 8;

                i++
            ) {

                const angle =
                    i *
                    Math.PI /
                    4;


                const radius =
                    i % 2 === 0
                        ? enemy.radius
                        : enemy.radius * 0.45;


                const x =
                    Math.cos(angle) *
                    radius;


                const y =
                    Math.sin(angle) *
                    radius;


                if (
                    i === 0
                ) {

                    ctx.moveTo(
                        x,
                        y
                    );

                }

                else {

                    ctx.lineTo(
                        x,
                        y
                    );
                }
            }


            ctx.closePath();


            ctx.fill();
        }


        /*
            Tank health bar.
        */

        if (
            enemy.type === "tank"
        ) {

            const healthWidth =
                enemy.radius * 2;


            const healthRatio =
                Math.max(
                    0,
                    enemy.hp / 3
                );


            ctx.fillStyle =
                "rgba(255,255,255,.2)";


            ctx.fillRect(
                -enemy.radius,
                enemy.radius + 7,
                healthWidth,
                3
            );


            ctx.fillStyle =
                COLORS.white;


            ctx.fillRect(
                -enemy.radius,
                enemy.radius + 7,
                healthWidth *
                healthRatio,
                3
            );
        }


        ctx.restore();
    }
}


/* ==================================================
   DRAW ORBS
================================================== */

function drawOrbs() {

    for (
        const orb of orbsOnMap
    ) {

        const scale =
            1 +
            Math.sin(
                orb.pulse
            ) *
            0.25;


        ctx.save();


        ctx.translate(
            orb.x,
            orb.y
        );


        ctx.scale(
            scale,
            scale
        );


        ctx.shadowBlur =
            25;


        ctx.shadowColor =
            COLORS.yellow;


        ctx.fillStyle =
            COLORS.yellow;


        ctx.beginPath();


        ctx.arc(
            0,
            0,
            orb.radius,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();
    }
}


/* ==================================================
   DRAW PARTICLES
================================================== */

function drawParticles() {

    for (
        const particle of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life /
                particle.maxLife
            );


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            particle.x,
            particle.y,
            particle.size,
            particle.size
        );
    }


    ctx.globalAlpha =
        1;
}


/* ==================================================
   DRAW UI
================================================== */

function drawUI() {

    /*
        The Home Screen already has
        its own HTML UI.
    */

    if (
        homeScreen
    ) {

        return;
    }


    ctx.shadowBlur =
        0;


    ctx.textAlign =
        "left";


    /* ------------------------------------------
       SCORE
    ------------------------------------------ */

    ctx.fillStyle =
        COLORS.white;


    ctx.font =
        "bold 20px Arial";


    ctx.fillText(
        `SCORE ${score}`,
        20,
        30
    );


    ctx.font =
        "14px Arial";


    ctx.fillText(
        `TIME ${timeAlive.toFixed(1)}s`,
        20,
        52
    );


    /* ------------------------------------------
       HEALTH
    ------------------------------------------ */

    ctx.fillStyle =
        COLORS.red;


    ctx.font =
        "bold 14px Arial";


    ctx.fillText(
        "HP",
        20,
        75
    );


    for (
        let i = 0;

        i < player.maxHealth;

        i++
    ) {

        ctx.fillStyle =
            i < player.health
                ? COLORS.red
                : "rgba(255,255,255,.15)";


        ctx.fillRect(
            50 + i * 18,
            65,
            13,
            10
        );
    }


    /* ------------------------------------------
       ORBS
    ------------------------------------------ */

    ctx.fillStyle =
        COLORS.yellow;


    ctx.font =
        "bold 15px Arial";


    ctx.fillText(
        `ORBS ${orbs}`,
        20,
        96
    );


    /* ------------------------------------------
       RIGHT SIDE
    ------------------------------------------ */

    ctx.textAlign =
        "right";


    ctx.fillStyle =
        COLORS.white;


    ctx.font =
        "14px Arial";


    ctx.fillText(
        `BEST ${highScore}`,
        width - 20,
        30
    );


    if (
        shopCooldown > 0
    ) {

        ctx.fillStyle =
            COLORS.red;


        ctx.fillText(
            `SHOP ${shopCooldown.toFixed(1)}s`,
            width - 20,
            52
        );

    }

    else if (
        shopReadyDelay > 0
    ) {

        ctx.fillStyle =
            "#888";


        ctx.fillText(
            "SHOP LOADING",
            width - 20,
            52
        );

    }

    else {

        ctx.fillStyle =
            COLORS.cyan;


        ctx.fillText(
            "SHOP READY",
            width - 20,
            52
        );
    }


    /* ------------------------------------------
       DASH BAR
    ------------------------------------------ */

    const barWidth =
        120;


    const dashProgress =
        Math.max(
            0,
            1 -
            player.dashCooldown /
            player.dashMaxCooldown
        );


    ctx.textAlign =
        "left";


    ctx.fillStyle =
        "rgba(255,255,255,.16)";


    ctx.fillRect(
        20,
        height - 30,
        barWidth,
        7
    );


    ctx.fillStyle =
        COLORS.cyan;


    ctx.fillRect(
        20,
        height - 30,
        barWidth *
        dashProgress,
        7
    );


    /* ------------------------------------------
       CONTROLS
    ------------------------------------------ */

    ctx.font =
        "12px Arial";


    ctx.fillStyle =
        "rgba(255,255,255,.72)";


    ctx.fillText(
        "WASD MOVE   IJKL AIM   SPACE FIRE   SHIFT DASH   P SHOP",
        20,
        height - 40
    );


    ctx.textAlign =
        "right";


    ctx.fillText(
        "Yellow orbs = shop currency",
        width - 20,
        height - 20
    );


    ctx.textAlign =
        "left";
}


/* ==================================================
   MAIN GAME LOOP
================================================== */

function frame(now) {

    /*
        First frame after starting a round
        gets delta = 0.

        Subsequent frames are capped at
        50ms to prevent physics explosions
        after browser stalls.
    */

    const delta =
        lastTime === 0

            ? 0

            : Math.min(
                (now - lastTime) /
                1000,
                0.05
            );


    lastTime =
        now;


    update(
        delta
    );


    draw();


    /*
        Always schedule the next frame.
    */

    requestAnimationFrame(
        frame
    );
}


/* ==================================================
   INITIALIZE
================================================== */

resize();


/*
    Important difference from the
    previous version:

    The game is NOT started here.

    The player first sees the Home Screen.
*/

updateMessage();


requestAnimationFrame(
    frame
);

</script>
