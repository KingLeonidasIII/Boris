<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Escape</title>
<style>*{box-sizing:border-box;}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050a;color:white;font-family:Arial,sans-serif;touch-action:none;}canvas{display:block;width:100%;height:100%;}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}#message{display:none;width:min(760px,94vw);max-height:92vh;overflow-y:auto;padding:24px;text-align:center;background:rgba(0,0,0,0.94);border:1px solid rgba(0,255,255,0.4);border-radius:14px;box-shadow:0 0 50px rgba(0,255,255,0.15);pointer-events:auto;}#message.show{display:block;}#message h1{margin:0 0 8px;font-size:38px;}#message p{color:#bbb;line-height:1.45;}.main-button{display:block;width:min(360px,80vw);margin:18px auto 0;padding:14px;border:1px solid #00ffff;border-radius:8px;background:#00ffff;color:#001010;font-size:18px;font-weight:bold;cursor:pointer;}.main-button:hover{filter:brightness(1.15);}.secondary-button{background:transparent;color:#00ffff;}.home-buttons{display:flex;flex-direction:column;align-items:center;}.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px;}.shop-item{border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);border-radius:10px;padding:14px;text-align:left;}.shop-item h3{margin:0 0 5px;}.shop-item p{font-size:13px;line-height:1.4;min-height:52px;}.shop-item button{width:100%;padding:9px;border:0;border-radius:7px;background:#00ffff;color:#001010;font-weight:bold;cursor:pointer;}.shop-item button:disabled{opacity:0.3;cursor:not-allowed;}.ability-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}.ability-count{color:#ffe600;font-weight:bold;font-size:18px;}.ability-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}.ability-card{position:relative;min-height:145px;padding:14px;text-align:left;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.035);cursor:pointer;transition:transform 0.12s,border-color 0.12s,background 0.12s;}.ability-card:hover{transform:translateY(-2px);border-color:rgba(0,255,255,0.55);}.ability-card.selected{border-color:#ffe600;background:rgba(255,230,0,0.09);box-shadow:inset 0 0 20px rgba(255,230,0,0.04);}.ability-card.disabled{opacity:0.42;}.ability-number{position:absolute;top:9px;right:10px;color:#777;font-size:12px;font-weight:bold;}.ability-card h3{margin:0 25px 7px 0;color:#00ffff;font-size:17px;}.ability-card.selected h3{color:#ffe600;}.ability-card p{margin:0;color:#aaa;font-size:13px;line-height:1.4;}.equipped-label{display:inline-block;margin-top:10px;padding:4px 7px;border-radius:5px;background:#ffe600;color:#151500;font-size:11px;font-weight:bold;}@media (max-width:600px){#message{padding:16px;}.shop-grid,.ability-grid{grid-template-columns:1fr;}.shop-item p{min-height:auto;}.ability-card{min-height:125px;}}</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay"><div id="message"></div></div>
<script>"use strict";const canvas=document.getElementById("game");const ctx=canvas.getContext("2d");const message=document.getElementById("message");let width=0,height=0,dpr=1;function resize(){dpr=Math.min(window.devicePixelRatio||1,2);width=Math.max(1,window.innerWidth);height=Math.max(1,window.innerHeight);canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);canvas.style.width=width+"px";canvas.style.height=height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);if(!Number.isFinite(player.x))player.x=width/2;if(!Number.isFinite(player.y))player.y=height/2;player.x=Math.max(player.radius,Math.min(width-player.radius,player.x));player.y=Math.max(player.radius,Math.min(height-player.radius,player.y));}window.addEventListener("resize",resize);const keys=Object.create(null);function keyDown(event){const key=event.key.toLowerCase();keys[key]=true;const gameKeys=["w","a","s","d","i","j","k","l","arrowup","arrowdown","arrowleft","arrowright"," ","shift","p","r","h","b","escape","enter","1","2","3","4","5","6","7","8","9","q","e"];if(gameKeys.includes(key))event.preventDefault();if(event.repeat)return;if(abilityScreen){if(key==="escape"||key==="b"){showHome();return;}handleAbilityKey(key);return;}if(homeScreen){if(key==="enter"||key===" "){startRound();return;}if(key==="b"){showAbilities();return;}return;}if(key==="p"&&!gameOver){toggleShop();return;}if(gameOver){if(key==="r")restart();else if(key==="h")goHome();return;}if(key===" ")shoot();else if(key==="shift")dash();}function handleAbilityKey(key){const mapping={"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"7":6,"8":7,"9":8,q:9,w:10,e:11,r:12};if(Object.prototype.hasOwnProperty.call(mapping,key))toggleAbility(mapping[key]);}window.addEventListener("keydown",keyDown);window.addEventListener("keyup",event=>{keys[event.key.toLowerCase()]=false;});window.addEventListener("blur",()=>{for(const key in keys)keys[key]=false;});let paused=false,gameOver=false,homeScreen=true,abilityScreen=false,score=0,orbs=0,timeAlive=0,spawnTimer=0,orbTimer=0,shopCooldown=0,shopReadyDelay=1.5,screenShake=0,lastTime=0;const SHOP_COOLDOWN_TIME=10;const bullets=[],enemies=[],orbsOnMap=[],particles=[];const COLORS={bg:"#05050a",grid:"rgba(0,255,255,0.07)",cyan:"#00ffff",red:"#ff1744",yellow:"#ffe600",white:"#ffffff",scatter:"#ff66cc"};let highScore=0;try{highScore=Number(localStorage.getItem("neonEscapeHighScore"))||0;}catch(error){highScore=0;}const ABILITIES=[{id:"reinforcedHull",name:"REINFORCED HULL",description:"Start each run with +1 maximum health.",color:"#ff5555"},{id:"emergencyShield",name:"EMERGENCY SHIELD",description:"The first enemy collision of each run is absorbed without losing health.",color:"#66ccff"},{id:"magneticCore",name:"MAGNETIC CORE",description:"Yellow orbs are attracted from 85 pixels away instead of only on contact.",color:"#ffe600"},{id:"scavenger",name:"SCAVENGER",description:"Enemy kills have a 12% chance to create an extra yellow orb.",color:"#ffe600"},{id:"quickStart",name:"QUICK START",description:"Begin every run with the first 5 seconds of enemy spawning slowed by 25%.",color:"#00ffff"},{id:"overchargedCore",name:"OVERCHARGED CORE",description:"Your normal cannon and scatter pellets deal 15% more damage.",color:"#ff9933"},{id:"stabilizers",name:"STABILIZERS",description:"Your movement speed is permanently increased by 10%.",color:"#00ff88"},{id:"afterburner",name:"AFTERBURNER",description:"Dash cooldown is permanently reduced by 12%.",color:"#a66cff"},{id:"quickHands",name:"QUICK HANDS",description:"The cannon's base firing delay is permanently reduced by 10%.",color:"#00ffff"},{id:"thickBarrel",name:"THICK BARREL",description:"Bullets travel 12% faster and remain active slightly longer.",color:"#ff7b00"},{id:"collector",name:"COLLECTOR",description:"Collected yellow orbs are worth 2 orbs every fifth pickup.",color:"#ffe600"},{id:"lastStand",name:"LAST STAND",description:"At 1 HP, movement speed increases by 20%.",color:"#ff1744"},{id:"combatTraining",name:"COMBAT TRAINING",description:"Enemy contact damage has a small knockback effect, giving you more room to recover.",color:"#ffffff"}];let selectedAbilities=[null,null];const ABILITY_STORAGE_KEY="neonEscapePermanentAbilities";function loadAbilities(){try{const saved=localStorage.getItem(ABILITY_STORAGE_KEY);if(!saved)return;const parsed=JSON.parse(saved);if(!Array.isArray(parsed)||parsed.length!==2)return;const validIds=new Set(ABILITIES.map(ability=>ability.id));const cleaned=parsed.map(id=>validIds.has(id)?id:null);if(cleaned[0]!==null&&cleaned[0]===cleaned[1])cleaned[1]=null;selectedAbilities=cleaned;}catch(error){selectedAbilities=[null,null];}}function saveAbilities(){try{localStorage.setItem(ABILITY_STORAGE_KEY,JSON.stringify(selectedAbilities));}catch(error){}}loadAbilities();function hasAbility(id){return selectedAbilities[0]===id||selectedAbilities[1]===id;}function abilityIndex(id){return selectedAbilities.indexOf(id);}function toggleAbility(index){if(!abilityScreen||index<0||index>=ABILITIES.length)return;const id=ABILITIES[index].id;const existingSlot=abilityIndex(id);if(existingSlot!==-1){selectedAbilities[existingSlot]=null;saveAbilities();updateAbilityMessage();return;}const emptySlot=selectedAbilities.indexOf(null);if(emptySlot!==-1){selectedAbilities[emptySlot]=id;saveAbilities();updateAbilityMessage();}}const player={x:0,y:0,radius:14,moveSpeed:300,aimAngle:0,aimX:1,aimY:0,fireCooldown:0,fireRate:.16,bulletSpeed:850,bulletDamage:1,dashCooldown:0,dashMaxCooldown:1.1,dashTime:0,dashDuration:.12,dashSpeed:1000,maxHealth:3,health:3,emergencyShieldUsed:false,pickupCount:0};const upgrades={rapid:{level:0,maxLevel:3,cost:3},heavy:{level:0,maxLevel:2,cost:5},thrusters:{level:0,maxLevel:3,cost:4},overdrive:{level:0,maxLevel:2,cost:6},scatter:{level:0,maxLevel:1,cost:12}};function down(key){return keys[key]===true;}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}function applyUpgrades(){let fireRate=.16;if(hasAbility("quickHands"))fireRate*=.9;fireRate*=Math.pow(.8,upgrades.rapid.level);player.fireRate=fireRate;let damage=1+upgrades.heavy.level;if(hasAbility("overchargedCore"))damage*=1.15;player.bulletDamage=damage;let movement=300;if(hasAbility("stabilizers"))movement*=1.1;player.moveSpeed=movement*(1+upgrades.thrusters.level*.15);let dashCooldown=1.1;if(hasAbility("afterburner"))dashCooldown*=.88;dashCooldown*=Math.pow(.8,upgrades.overdrive.level);player.dashMaxCooldown=dashCooldown;player.bulletSpeed=850*(hasAbility("thickBarrel")?1.12:1);}function resetUpgrades(){for(const upgrade of Object.values(upgrades))upgrade.level=0;applyUpgrades();}function clearRoundObjects(){bullets.length=0;enemies.length=0;orbsOnMap.length=0;particles.length=0;}function resetPlayer(){player.maxHealth=hasAbility("reinforcedHull")?4:3;player.health=player.maxHealth;player.x=width/2;player.y=height/2;player.fireCooldown=0;player.dashCooldown=0;player.dashTime=0;player.aimAngle=0;player.aimX=1;player.aimY=0;player.dashX=1;player.dashY=0;player.emergencyShieldUsed=false;player.pickupCount=0;}function startRound(){homeScreen=false;abilityScreen=false;paused=false;gameOver=false;score=0;orbs=0;timeAlive=0;spawnTimer=.25;orbTimer=getOrbSpawnInterval();shopCooldown=0;shopReadyDelay=1.5;screenShake=0;lastTime=0;clearRoundObjects();resetPlayer();resetUpgrades();updateMessage();}function restart(){startRound();}function goHome(){homeScreen=true;abilityScreen=false;paused=false;gameOver=false;lastTime=0;clearRoundObjects();updateMessage();}function showHome(){homeScreen=true;abilityScreen=false;paused=false;gameOver=false;lastTime=0;updateMessage();}function showAbilities(){if(!homeScreen||gameOver)return;paused=false;abilityScreen=true;updateMessage();}function abilityHTML(ability,index){const selected=hasAbility(ability.id);const slot=abilityIndex(ability.id);const keyboard=index<9?String(index+1):index===9?"Q":index===10?"W":index===11?"E":"R";return `<div class="ability-card ${selected?"selected":""}" onclick="toggleAbility(${index})"><span class="ability-number">${keyboard}</span><h3 style="color:${selected?"#ffe600":ability.color};">${ability.name}</h3><p>${ability.description}</p>${selected?`<span class="equipped-label">EQUIPPED—SLOT ${slot+1}</span>`:""}</div>`;}function updateAbilityMessage(){const first=selectedAbilities[0],second=selectedAbilities[1];message.innerHTML=`<div class="ability-header"><div style="text-align:left"><h1 style="color:#00ffff;margin-bottom:4px;">ABILITIES</h1><p style="margin:0;font-size:13px;">Choose two permanent abilities for your runs.</p></div><div class="ability-count">${[first,second].filter(Boolean).length}/2</div></div><p style="font-size:13px;color:#888;">Equipped abilities stay active across new rounds and do not cost yellow orbs.<br>Click an ability or use its keyboard key.</p><div class="ability-grid">${ABILITIES.map((ability,index)=>abilityHTML(ability,index)).join("")}</div><p style="font-size:13px;color:#777;margin-bottom:0;">${first!==null||second!==null?"Your loadout is saved automatically.":"Choose two abilities to complete your loadout."}<br>Keys 1–9, Q, W, E, R select abilities.</p><button class="main-button secondary-button" onclick="showHome()">BACK TO HOME</button>`;message.classList.add("show");}window.toggleAbility=toggleAbility;window.showAbilities=showAbilities;window.showHome=showHome;function toggleShop(){if(gameOver||homeScreen)return;if(paused){paused=false;updateMessage();return;}if(shopCooldown>0||shopReadyDelay>0)return;paused=true;shopCooldown=SHOP_COOLDOWN_TIME;updateShopMessage();}function upgradeHTML(id,name,description,color){const upgrade=upgrades[id];const maxed=upgrade.level>=upgrade.maxLevel;const canBuy=orbs>=upgrade.cost&&!maxed;return `<div class="shop-item"><h3 style="color:${color}">${name}</h3><p>${description}<br>Level: ${upgrade.level}/${upgrade.maxLevel}</p><button onclick="buyUpgrade('${id}')" ${canBuy?"":"disabled"}>${maxed?"MAXED":`BUY—${upgrade.cost}ORBS`}</button></div>`;}function updateShopMessage(){const cooldownText=shopCooldown>0?`<span style="color:#ff1744">Shop cooldown: ${shopCooldown.toFixed(1)}s</span>`:"Shop cooldown ready.";message.innerHTML=`<h1 style="color:#00ffff">ARMORY</h1><p>Spend yellow orbs on temporary upgrades. All shop upgrades reset when the round ends.</p><p style="color:#ffe600;font-weight:bold;font-size:20px;">ORBS: ${orbs}</p><div class="shop-grid">${upgradeHTML("rapid","RAPID FIRE","20% less cannon delay per level.",COLORS.cyan)}${upgradeHTML("heavy","HEAVY CANNON","+1 normal-cannon damage per level. Scatter pellets also benefit.","#ff7b00")}${upgradeHTML("thrusters","THRUSTERS","+15% movement speed per level.","#00ff88")}${upgradeHTML("overdrive","OVERDRIVE","20% less dash cooldown per level.","#a66cff")}<div class="shop-item"><h3 style="color:#ff5555">REPAIR</h3><p>Restore one health point.<br>Health: ${player.health}/${player.maxHealth}</p><button onclick="buyUpgrade('repair')" ${orbs>=2&&player.health<player.maxHealth?"":"disabled"}>${player.health>=player.maxHealth?"FULL HEALTH":"BUY — 2 ORBS"}</button></div>${upgradeHTML("scatter","SCATTER CANNON","Replaces the normal cannon with 7 low-damage pellets fired in a wide cone.",COLORS.scatter)}</div><p style="font-size:13px;color:#888;">Press P to close. ${cooldownText}<br><br>Keys: 1 Rapid · 2 Heavy · 3 Thrusters · 4 Overdrive · 5 Repair · 6 Scatter</p>`;message.classList.add("show");}function buyUpgrade(id){if(!paused||gameOver||homeScreen)return;if(id==="repair"){if(orbs>=2&&player.health<player.maxHealth){orbs-=2;player.health+=1;makeParticles(player.x,player.y,COLORS.cyan,18,180);updateShopMessage();}return;}const upgrade=upgrades[id];if(!upgrade||upgrade.level>=upgrade.maxLevel||orbs<upgrade.cost)return;orbs-=upgrade.cost;upgrade.level+=1;applyUpgrades();makeParticles(player.x,player.y,COLORS.yellow,18,180);updateShopMessage();}window.buyUpgrade=buyUpgrade;window.startRound=startRound;window.restart=restart;window.goHome=goHome;function updateMessage(){if(abilityScreen){updateAbilityMessage();return;}if(homeScreen){message.innerHTML=`<h1 style="color:#00ffff">NEON ESCAPE</h1><p>Survive as long as possible, destroy enemies, collect yellow orbs and spend them in the Armory.</p><div class="home-buttons"><button class="main-button" onclick="startRound()">PLAY ROUND</button><button class="main-button secondary-button" onclick="showAbilities()">PERMANENT ABILITIES</button></div><p style="font-size:13px;color:#888;">ENTER / SPACE — Play<br>B — Abilities</p>`;message.classList.add("show");return;}if(gameOver){message.innerHTML=`<h1 style="color:#ff1744">GAME OVER</h1><p>Score: <strong>${score}</strong></p><p>Best: <strong>${highScore}</strong></p><p>Orbs collected: <strong>${orbs}</strong></p><button class="main-button" onclick="restart()">PLAY AGAIN</button><button class="main-button secondary-button" onclick="goHome()">HOME</button><p style="font-size:13px;color:#888;">R — Play Again<br>H — Home</p>`;message.classList.add("show");return;}if(paused){updateShopMessage();return;}message.classList.remove("show");}function randomEdgePosition(margin=50){const side=Math.floor(Math.random()*4);if(side===0)return{x:Math.random()*width,y:-margin};if(side===1)return{x:width+margin,y:Math.random()*height};if(side===2)return{x:Math.random()*width,y:height+margin};return{x:-margin,y:Math.random()*height};}function getEnemySpawnInterval(){return Math.max(.16,1-timeAlive*.009);}function getOrbSpawnInterval(){const enemyInterval=getEnemySpawnInterval();const baseEnemyInterval=1;const relativeDifficulty=enemyInterval/baseEnemyInterval;return Math.max(.65,2.5*relativeDifficulty);}function spawnEnemy(){const position=randomEdgePosition();const difficulty=1+timeAlive/30;const roll=Math.random();let type="normal";if(timeAlive>20&&roll<.20)type="fast";if(timeAlive>45&&roll>.82)type="tank";const enemy={x:position.x,y:position.y,rotation:Math.random()*Math.PI*2,type:type,hitFlash:0};if(type==="fast"){enemy.radius=9;enemy.speed=115*difficulty;enemy.hp=1;enemy.points=150;}else if(type==="tank"){enemy.radius=22;enemy.speed=42*difficulty;enemy.hp=3;enemy.points=400;}else{enemy.radius=14;enemy.speed=62*difficulty;enemy.hp=1;enemy.points=100;}enemies.push(enemy);}function spawnOrb(){const padding=70;orbsOnMap.push({x:padding+Math.random()*Math.max(1,width-padding*2),y:padding+Math.random()*Math.max(1,height-padding*2),radius:7,pulse:Math.random()*Math.PI*2,life:8});}function makeParticles(x,y,color,amount=10,speed=150){for(let i=0;i<amount;i++){const angle=Math.random()*Math.PI*2,velocity=speed*(.3+Math.random()*.7);particles.push({x,y,dx:Math.cos(angle)*velocity,dy:Math.sin(angle)*velocity,life:.3+Math.random()*.5,maxLife:.8,size:1.5+Math.random()*3,color});}}function fireBullet(angle,damage){const muzzle=31,x=player.x+Math.cos(angle)*muzzle,y=player.y+Math.sin(angle)*muzzle;bullets.push({x,y,dx:Math.cos(angle),dy:Math.sin(angle),radius:4,speed:player.bulletSpeed,damage,life:hasAbility("thickBarrel")?1.4:1.25});return{x,y};}function shoot(){if(gameOver||paused||homeScreen||player.fireCooldown>0)return;if(upgrades.scatter.level>0){const pelletCount=7,spread=.72;for(let i=0;i<pelletCount;i++){const t=i/(pelletCount-1),angle=player.aimAngle+(t-.5)*spread,pelletDamage=player.bulletDamage*.5;fireBullet(angle,pelletDamage);}const muzzle=31;makeParticles(player.x+Math.cos(player.aimAngle)*muzzle,player.y+Math.sin(player.aimAngle)*muzzle,COLORS.scatter,18,260);}else{const muzzle=fireBullet(player.aimAngle,player.bulletDamage);makeParticles(muzzle.x,muzzle.y,COLORS.white,8,220);}player.fireCooldown=player.fireRate;screenShake=Math.max(screenShake,upgrades.scatter.level>0?3:2);}function dash(){if(gameOver||paused||homeScreen||player.dashCooldown>0)return;let dx=0,dy=0;if(down("w")||down("arrowup"))dy-=1;if(down("s")||down("arrowdown"))dy+=1;if(down("a")||down("arrowleft"))dx-=1;if(down("d")||down("arrowright"))dx+=1;const length=Math.hypot(dx,dy);if(length>0){dx/=length;dy/=length;}else{dx=player.dashX;dy=player.dashY;}player.dashX=dx;player.dashY=dy;player.dashTime=player.dashDuration;player.dashCooldown=player.dashMaxCooldown;makeParticles(player.x,player.y,COLORS.cyan,25,260);}function damagePlayer(){if(hasAbility("emergencyShield")&&!player.emergencyShieldUsed){player.emergencyShieldUsed=true;makeParticles(player.x,player.y,"#66ccff",35,280);screenShake=7;return;}player.health-=1;makeParticles(player.x,player.y,COLORS.red,30,250);screenShake=10;if(player.health<=0)endGame();}function update(delta){if(shopCooldown>0)shopCooldown=Math.max(0,shopCooldown-delta);if(shopReadyDelay>0)shopReadyDelay=Math.max(0,shopReadyDelay-delta);if(paused||gameOver||homeScreen){updateParticles(delta);return;}timeAlive+=delta;score=Math.max(score,Math.floor(timeAlive*10));screenShake=Math.max(0,screenShake-delta*12);let aimX=0,aimY=0;if(down("i")||down("arrowup"))aimY-=1;if(down("k")||down("arrowdown"))aimY+=1;if(down("j")||down("arrowleft"))aimX-=1;if(down("l")||down("arrowright"))aimX+=1;const aimLength=Math.hypot(aimX,aimY);if(aimLength>0){aimX/=aimLength;aimY/=aimLength;player.aimX=aimX;player.aimY=aimY;player.aimAngle=Math.atan2(aimY,aimX);}let moveX=0,moveY=0;if(down("w"))moveY-=1;if(down("s"))moveY+=1;if(down("a"))moveX-=1;if(down("d"))moveX+=1;const moveLength=Math.hypot(moveX,moveY);if(moveLength>0){moveX/=moveLength;moveY/=moveLength;player.dashX=moveX;player.dashY=moveY;}if(player.fireCooldown>0)player.fireCooldown-=delta;if(player.dashCooldown>0)player.dashCooldown-=delta;if(down(" "))shoot();let currentMoveSpeed=player.moveSpeed;if(hasAbility("lastStand")&&player.health===1)currentMoveSpeed*=1.2;if(player.dashTime>0){player.dashTime-=delta;player.x+=player.dashX*player.dashSpeed*delta;player.y+=player.dashY*player.dashSpeed*delta;}else{player.x+=moveX*currentMoveSpeed*delta;player.y+=moveY*currentMoveSpeed*delta;}player.x=Math.max(player.radius,Math.min(width-player.radius,player.x));player.y=Math.max(player.radius,Math.min(height-player.radius,player.y));spawnTimer-=delta;let spawnInterval=getEnemySpawnInterval();if(hasAbility("quickStart")&&timeAlive<5)spawnInterval*=1.25;if(spawnTimer<=0){spawnEnemy();spawnTimer=spawnInterval;}orbTimer-=delta;if(orbTimer<=0){if(orbsOnMap.length<3)spawnOrb();orbTimer=getOrbSpawnInterval();}updateBullets(delta);updateEnemies(delta);updateOrbs(delta);updateParticles(delta);}function updateBullets(delta){for(let i=bullets.length-1;i>=0;i--){const bullet=bullets[i];bullet.x+=bullet.dx*bullet.speed*delta;bullet.y+=bullet.dy*bullet.speed*delta;bullet.life-=delta;if(bullet.life<=0||bullet.x<-60||bullet.x>width+60||bullet.y<-60||bullet.y>height+60){bullets.splice(i,1);continue;}for(let j=enemies.length-1;j>=0;j--){const enemy=enemies[j];if(distance(bullet,enemy)<bullet.radius+enemy.radius){enemy.hp-=bullet.damage;enemy.hitFlash=.08;makeParticles(bullet.x,bullet.y,COLORS.white,5,150);bullets.splice(i,1);if(enemy.hp<=0){score+=enemy.points;if(hasAbility("scavenger")&&Math.random()<.12&&orbsOnMap.length<5)spawnOrb();makeParticles(enemy.x,enemy.y,COLORS.red,enemy.type==="tank"?30:18,220);screenShake=Math.max(screenShake,enemy.type==="tank"?6:3);enemies.splice(j,1);}break;}}}}function updateEnemies(delta){for(let i=enemies.length-1;i>=0;i--){const enemy=enemies[i],angle=Math.atan2(player.y-enemy.y,player.x-enemy.x);enemy.x+=Math.cos(angle)*enemy.speed*delta;enemy.y+=Math.sin(angle)*enemy.speed*delta;enemy.rotation+=delta*(enemy.type==="fast"?4:2);enemy.hitFlash=Math.max(0,enemy.hitFlash-delta);if(distance(player,enemy)<player.radius+enemy.radius){enemies.splice(i,1);if(hasAbility("combatTraining")){const angleAway=Math.atan2(player.y-enemy.y,player.x-enemy.x);player.x+=Math.cos(angleAway)*55;player.y+=Math.sin(angleAway)*55;player.x=Math.max(player.radius,Math.min(width-player.radius,player.x));player.y=Math.max(player.radius,Math.min(height-player.radius,player.y));}damagePlayer();if(gameOver)return;}}}function updateOrbs(delta){const magnetRadius=hasAbility("magneticCore")?85:0;for(let i=orbsOnMap.length-1;i>=0;i--){const orb=orbsOnMap[i];orb.life-=delta;orb.pulse+=delta*5;if(magnetRadius>0){const dx=player.x-orb.x,dy=player.y-orb.y,distanceToPlayer=Math.hypot(dx,dy);if(distanceToPlayer>0&&distanceToPlayer<magnetRadius){const pull=180*(1-distanceToPlayer/magnetRadius);orb.x+=dx/distanceToPlayer*pull*delta;orb.y+=dy/distanceToPlayer*pull*delta;}}if(distance(player,orb)<player.radius+orb.radius+5){player.pickupCount+=1;let value=1;if(hasAbility("collector")&&player.pickupCount%5===0)value=2;orbs+=value;makeParticles(orb.x,orb.y,COLORS.yellow,value===2?35:25,220);orbsOnMap.splice(i,1);}else if(orb.life<=0)orbsOnMap.splice(i,1);}}function updateParticles(delta){for(let i=particles.length-1;i>=0;i--){const particle=particles[i];particle.life-=delta;particle.x+=particle.dx*delta;particle.y+=particle.dy*delta;particle.dx*=Math.pow(.05,delta);particle.dy*=Math.pow(.05,delta);if(particle.life<=0)particles.splice(i,1);}}function endGame(){gameOver=true;if(score>highScore){highScore=score;try{localStorage.setItem("neonEscapeHighScore",String(highScore));}catch(error){}}makeParticles(player.x,player.y,COLORS.red,55,300);screenShake=12;updateMessage();}function draw(){ctx.save();if(screenShake>0)ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);drawBackground();drawOrbs();drawEnemies();drawBullets();drawParticles();drawPlayer();drawUI();ctx.restore();}function drawBackground(){ctx.fillStyle=COLORS.bg;ctx.fillRect(-20,-20,width+40,height+40);const grid=50;ctx.strokeStyle=COLORS.grid;ctx.lineWidth=1;for(let x=0;x<=width;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke();}for(let y=0;y<=height;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}}function drawPlayer(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.aimAngle);ctx.shadowBlur=18;ctx.shadowColor=upgrades.scatter.level>0?COLORS.scatter:COLORS.cyan;ctx.fillStyle=upgrades.scatter.level>0?COLORS.scatter:COLORS.cyan;if(upgrades.scatter.level>0)ctx.fillRect(0,-7,32,14);else ctx.fillRect(0,-4,32,8);ctx.fillStyle=COLORS.white;ctx.fillRect(26,-5,8,10);ctx.shadowBlur=25;ctx.shadowColor=upgrades.scatter.level>0?COLORS.scatter:COLORS.cyan;ctx.fillStyle=upgrades.scatter.level>0?COLORS.scatter:COLORS.cyan;ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-12,-10);ctx.lineTo(-7,0);ctx.lineTo(-12,10);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=COLORS.bg;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-5);ctx.lineTo(-3,0);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();ctx.restore();if(player.dashCooldown<=0&&!homeScreen&&!gameOver){ctx.strokeStyle="rgba(0,255,255,.7)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,player.radius+8+Math.sin(performance.now()/100)*2,0,Math.PI*2);ctx.stroke();}if(hasAbility("emergencyShield")&&!player.emergencyShieldUsed&&!homeScreen&&!gameOver){ctx.strokeStyle="rgba(102,204,255,.75)";ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(player.x,player.y,player.radius+14,0,Math.PI*2);ctx.stroke();}}function drawBullets(){ctx.fillStyle=COLORS.white;ctx.shadowBlur=14;ctx.shadowColor=upgrades.scatter.level>0?COLORS.scatter:COLORS.white;for(const bullet of bullets){ctx.beginPath();ctx.arc(bullet.x,bullet.y,bullet.radius,0,Math.PI*2);ctx.fill();}ctx.shadowBlur=0;}function drawEnemies(){for(const enemy of enemies){ctx.save();ctx.translate(enemy.x,enemy.y);ctx.rotate(enemy.rotation);ctx.shadowBlur=18;ctx.shadowColor=COLORS.red;ctx.fillStyle=enemy.hitFlash>0?COLORS.white:COLORS.red;if(enemy.type==="tank"){ctx.fillRect(-enemy.radius,-enemy.radius,enemy.radius*2,enemy.radius*2);ctx.fillStyle=COLORS.bg;ctx.fillRect(-7,-7,14,14);}else if(enemy.type==="fast"){ctx.beginPath();ctx.moveTo(enemy.radius,0);ctx.lineTo(-enemy.radius,-enemy.radius*.65);ctx.lineTo(-enemy.radius,enemy.radius*.65);ctx.closePath();ctx.fill();}else{ctx.beginPath();for(let i=0;i<8;i++){const angle=i*Math.PI/4,radius=i%2===0?enemy.radius:enemy.radius*.45,x=Math.cos(angle)*radius,y=Math.sin(angle)*radius;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fill();}if(enemy.type==="tank"){const healthWidth=enemy.radius*2,healthRatio=Math.max(0,enemy.hp/3);ctx.fillStyle="rgba(255,255,255,.2)";ctx.fillRect(-enemy.radius,enemy.radius+7,healthWidth,3);ctx.fillStyle=COLORS.white;ctx.fillRect(-enemy.radius,enemy.radius+7,healthWidth*healthRatio,3);}ctx.restore();}}function drawOrbs(){for(const orb of orbsOnMap){const scale=1+Math.sin(orb.pulse)*.25;ctx.save();ctx.translate(orb.x,orb.y);ctx.scale(scale,scale);ctx.shadowBlur=25;ctx.shadowColor=COLORS.yellow;ctx.fillStyle=COLORS.yellow;ctx.beginPath();ctx.arc(0,0,orb.radius,0,Math.PI*2);ctx.fill();ctx.restore();}}function drawParticles(){for(const particle of particles){ctx.globalAlpha=Math.max(0,particle.life/particle.maxLife);ctx.fillStyle=particle.color;ctx.fillRect(particle.x,particle.y,particle.size,particle.size);}ctx.globalAlpha=1;}function drawUI(){if(homeScreen)return;ctx.shadowBlur=0;ctx.textAlign="left";ctx.fillStyle=COLORS.white;ctx.font="bold 20px Arial";ctx.fillText(`SCORE ${score}`,20,30);ctx.font="14px Arial";ctx.fillText(`TIME ${timeAlive.toFixed(1)}s`,20,52);ctx.fillStyle=COLORS.red;ctx.font="bold 14px Arial";ctx.fillText("HP",20,75);for(let i=0;i<player.maxHealth;i++){ctx.fillStyle=i<player.health?COLORS.red:"rgba(255,255,255,.15)";ctx.fillRect(50+i*18,65,13,10);}ctx.fillStyle=COLORS.yellow;ctx.font="bold 15px Arial";ctx.fillText(`ORBS ${orbs}`,20,96);ctx.textAlign="right";ctx.fillStyle=COLORS.white;ctx.font="14px Arial";ctx.fillText(`BEST ${highScore}`,width-20,30);if(shopCooldown>0){ctx.fillStyle=COLORS.red;ctx.fillText(`SHOP ${shopCooldown.toFixed(1)}s`,width-20,52);}else if(shopReadyDelay>0){ctx.fillStyle="#888";ctx.fillText("SHOP LOADING",width-20,52);}else{ctx.fillStyle=COLORS.cyan;ctx.fillText("SHOP READY",width-20,52);}const barWidth=120,dashProgress=Math.max(0,1-player.dashCooldown/player.dashMaxCooldown);ctx.textAlign="left";ctx.fillStyle="rgba(255,255,255,.16)";ctx.fillRect(20,height-30,barWidth,7);ctx.fillStyle=COLORS.cyan;ctx.fillRect(20,height-30,barWidth*dashProgress,7);ctx.font="12px Arial";ctx.fillStyle="rgba(255,255,255,.72)";ctx.fillText("WASD MOVE   IJKL AIM   SPACE FIRE   SHIFT DASH   P SHOP",20,height-40);ctx.textAlign="right";ctx.fillText("Yellow orbs = shop currency",width-20,height-20);ctx.textAlign="left";}function frame(now){const delta=lastTime===0?0:Math.min((now-lastTime)/1000,.05);lastTime=now;update(delta);draw();requestAnimationFrame(frame);}resize();updateMessage();requestAnimationFrame(frame);</script>
