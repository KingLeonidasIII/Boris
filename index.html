<body>

<canvas id="game"></canvas>

<script>

"use strict";


/* ==================================================
   DOM
================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");


/* ==================================================
   CANVAS
================================================== */

let width = 0;
let height = 0;
let dpr = 1;


function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        Math.floor(
            width * dpr
        );

    canvas.height =
        Math.floor(
            height * dpr
        );


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    if (
        player.x === 0 &&
        player.y === 0
    ) {

        player.x =
            width / 2;

        player.y =
            height / 2;
    }
}


window.addEventListener(
    "resize",
    resize
);


/* ==================================================
   INPUT
================================================== */

const keys =
    Object.create(null);


function setKey(
    event,
    value
) {

    const key =
        event.key.toLowerCase();

    keys[key] =
        value;


    const gameKeys = [

        "w",
        "a",
        "s",
        "d",

        "i",
        "j",
        "k",
        "l",

        "arrowup",
        "arrowdown",
        "arrowleft",
        "arrowright",

        " ",
        "shift",

        "p",
        "r",

        "1",
        "2",
        "3",
        "4",
        "5"

    ];


    if (
        gameKeys.includes(key)
    ) {

        event.preventDefault();
    }
}


window.addEventListener(
    "keydown",
    function(event) {

        setKey(
            event,
            true
        );


        /*
            Ignore repeated
            action keys.
        */

        if (event.repeat) {
            return;
        }


        const key =
            event.key.toLowerCase();


        /*
            Shop.
        */

        if (
            key === "p"
        ) {

            toggleShop();
        }


        /*
            Restart.
        */

        if (
            key === "r" &&
            gameOver
        ) {

            restart();
        }


        /*
            Fire.
        */

        if (
            key === " " &&
            !gameOver &&
            !paused
        ) {

            shoot();
        }


        /*
            Dash.
        */

        if (
            key === "shift" &&
            !gameOver &&
            !paused
        ) {

            dash();
        }


        /*
            Shop purchases.
        */

        if (
            paused &&
            !gameOver
        ) {

            if (key === "1") {
                buyUpgrade("rapid");
            }

            if (key === "2") {
                buyUpgrade("heavy");
            }

            if (key === "3") {
                buyUpgrade("thrusters");
            }

            if (key === "4") {
                buyUpgrade("overdrive");
            }

            if (key === "5") {
                buyUpgrade("repair");
            }
        }
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        setKey(
            event,
            false
        );
    }
);


/*
    Prevent stuck keys.
*/

window.addEventListener(
    "blur",
    function() {

        for (
            const key in keys
        ) {

            keys[key] = false;
        }
    }
);


/*
    Pause when browser
    visibility changes.
*/

document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden &&
            !gameOver
        ) {

            paused = true;

            updateMessage();
        }
    }
);


/* ==================================================
   GAME STATE
================================================== */

let paused = false;

let gameOver = false;


/*
    Score is separate from
    currency.
*/

let score = 0;

let orbs = 0;

let timeAlive = 0;


let highScore =
    Number(
        localStorage.getItem(
            "neonEscapeHighScore"
        )
    ) || 0;


/*
    Shop cooldown.

    The player has to wait
    this long after opening
    the shop before opening
    it again.
*/

let shopCooldown = 0;

const SHOP_COOLDOWN_TIME = 10;


/*
    Prevent shop opening
    immediately after starting.
*/

let shopReadyDelay = 1.5;


/*
    Enemy spawning.
*/

let spawnTimer = 0;

let orbTimer = 1.5;


/*
    Visual effects.
*/

let screenShake = 0;


/*
    Main loop timing.
*/

let lastTime =
    performance.now();


/* ==================================================
   OBJECT ARRAYS
================================================== */

const bullets = [];

const enemies = [];

const orbsOnMap = [];

const particles = [];


/* ==================================================
   COLORS
================================================== */

const COLORS = {

    bg:
        "#05050a",

    grid:
        "rgba(0,255,255,0.07)",

    cyan:
        "#00ffff",

    red:
        "#ff1744",

    yellow:
        "#ffe600",

    white:
        "#ffffff"
};


/* ==================================================
   PLAYER
================================================== */

const player = {

    x: 0,
    y: 0,

    radius: 14,


    /*
        Movement
    */

    moveSpeed: 300,


    /*
        Aim
    */

    aimAngle: 0,

    aimX: 1,
    aimY: 0,

    aimSpeed: 3.8,


    /*
        Cannon
    */

    fireCooldown: 0,

    fireRate: 0.16,

    bulletSpeed: 850,

    bulletDamage: 1,


    /*
        Dash
    */

    dashCooldown: 0,

    dashMaxCooldown: 1.1,

    dashTime: 0,

    dashDuration: 0.12,

    dashSpeed: 1000,

    dashX: 1,
    dashY: 0,


    /*
        Health
    */

    maxHealth: 3,

    health: 3
};


/* ==================================================
   UPGRADES
================================================== */

const upgrades = {

    rapid: {
        level: 0,
        maxLevel: 3,
        cost: 3
    },

    heavy: {
        level: 0,
        maxLevel: 2,
        cost: 5
    },

    thrusters: {
        level: 0,
        maxLevel: 3,
        cost: 4
    },

    overdrive: {
        level: 0,
        maxLevel: 2,
        cost: 6
    }
};


/* ==================================================
   KEY HELPER
================================================== */

function down(key) {

    return keys[key] === true;
}


/* ==================================================
   DISTANCE
================================================== */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}


/* ==================================================
   SHOP
================================================== */

function toggleShop() {

    /*
        Can't open during game
        over.
    */

    if (gameOver) {
        return;
    }


    /*
        If already open,
        closing is always allowed.
    */

    if (paused) {

        paused = false;

        updateMessage();

        return;
    }


    /*
        Shop cooldown.
    */

    if (
        shopCooldown > 0 ||
        shopReadyDelay > 0
    ) {

        return;
    }


    /*
        Open shop.
    */

    paused = true;

    shopCooldown =
        SHOP_COOLDOWN_TIME;

    updateMessage();
}


/* ==================================================
   SHOP HTML
================================================== */

function getUpgradeButton(
    id,
    name,
    description,
    color
) {

    const upgrade =
        upgrades[id];


    const maxed =
        upgrade.level >=
        upgrade.maxLevel;


    const affordable =
        orbs >=
        upgrade.cost;


    const disabled =
        maxed ||
        !affordable;


    let text;


    if (maxed) {

        text =
            "MAXED";

    }

    else {

        text =
            `BUY — ${upgrade.cost} ORBS`;
    }


    return `
        <div class="shop-item">

            <h3 style="color:${color}">
                ${name}
            </h3>

            <p>
                ${description}
                <br>
                Level:
                ${upgrade.level}/${upgrade.maxLevel}
            </p>

            <button
                onclick="buyUpgrade('${id}')"
                ${disabled ? "disabled" : ""}
            >
                ${text}
            </button>

        </div>
    `;
}


/* ==================================================
   UPDATE SHOP
================================================== */

function updateShopMessage() {

    message.innerHTML = `

        <div class="shop">

            <h1>
                ARMORY
            </h1>

            <div class="shop-subtitle">
                Spend yellow orbs on temporary upgrades.
            </div>

            <div class="shop-currency">
                ORBS: ${orbs}
            </div>


            <div class="shop-grid">

                ${getUpgradeButton(
                    "rapid",
                    "RAPID FIRE",
                    "Reduces cannon fire delay by 20% per level.",
                    "#00ffff"
                )}

                ${getUpgradeButton(
                    "heavy",
                    "HEAVY CANNON",
                    "Increases bullet damage by 1 per level.",
                    "#ff7b00"
                )}

                ${getUpgradeButton(
                    "thrusters",
                    "THRUSTERS",
                    "Increases movement speed by 15% per level.",
                    "#00ff88"
                )}

                ${getUpgradeButton(
                    "overdrive",
                    "OVERDRIVE",
                    "Reduces dash cooldown by 20% per level.",
                    "#a66cff"
                )}

                <div class="shop-item">

                    <h3 style="color:#ff5555">
                        REPAIR
                    </h3>

                    <p>
                        Restore one health point.
                        Costs 2 orbs.
                        <br>
                        Health:
                        ${player.health}/${player.maxHealth}
                    </p>

                    <button
                        onclick="buyUpgrade('repair')"
                        ${
                            player.health >=
                            player.maxHealth ||
                            orbs < 2
                                ? "disabled"
                                : ""
                        }
                    >
                        ${
                            player.health >=
                            player.maxHealth
                                ? "FULL HEALTH"
                                : "BUY — 2 ORBS"
                        }
                    </button>

                </div>

            </div>


            <div class="shop-footer">

                Press P to close.
                <br>

                ${
                    shopCooldown > 0
                        ? `<span class="cooldown">
                            Shop cooldown:
                            ${shopCooldown.toFixed(1)}s
                           </span>`
                        : "Shop ready after closing."
                }

                <br><br>

                Keyboard:
                1 Rapid Fire ·
                2 Heavy Cannon ·
                3 Thrusters ·
                4 Overdrive ·
                5 Repair

            </div>

        </div>
    `;

    message.classList.add(
        "show"
    );
}


/* ==================================================
   BUY UPGRADE
================================================== */

function buyUpgrade(id) {

    if (
        !paused ||
        gameOver
    ) {

        return;
    }


    /*
        Repair
    */

    if (
        id === "repair"
    ) {

        if (
            orbs >= 2 &&
            player.health <
            player.maxHealth
        ) {

            orbs -= 2;

            player.health += 1;

            makeParticles(
                player.x,
                player.y,
                COLORS.cyan,
                18,
                180
            );

            updateShopMessage();
        }

        return;
    }


    const upgrade =
        upgrades[id];


    if (!upgrade) {
        return;
    }


    if (
        upgrade.level >=
        upgrade.maxLevel
    ) {

        return;
    }


    if (
        orbs <
        upgrade.cost
    ) {

        return;
    }


    /*
        Purchase.
    */

    orbs -=
        upgrade.cost;

    upgrade.level += 1;


    /*
        Apply immediately.
    */

    applyUpgrades();


    makeParticles(
        player.x,
        player.y,
        COLORS.yellow,
        18,
        180
    );


    updateShopMessage();
}


/* ==================================================
   APPLY UPGRADES
================================================== */

function applyUpgrades() {

    /*
        Rapid fire:
        20% less delay per level.
    */

    player.fireRate =
        0.16 *
        Math.pow(
            0.8,
            upgrades.rapid.level
        );


    /*
        Heavy cannon:
        +1 damage per level.
    */

    player.bulletDamage =
        1 +
        upgrades.heavy.level;


    /*
        Thrusters:
        +15% movement per level.
    */

    player.moveSpeed =
        300 *
        (
            1 +
            upgrades.thrusters.level *
            0.15
        );


    /*
        Overdrive:
        -20% dash cooldown per level.
    */

    player.dashMaxCooldown =
        1.1 *
        Math.pow(
            0.8,
            upgrades.overdrive.level
        );
}


/* ==================================================
   UPDATE MESSAGE
================================================== */

function updateMessage() {

    if (gameOver) {

        message.innerHTML = `

            <h1 style="color:${COLORS.red}">
                GAME OVER
            </h1>

            <p>
                Score:
                <strong>
                    ${score}
                </strong>
            </p>

            <p>
                Best:
                <strong>
                    ${highScore}
                </strong>
            </p>

            <p>
                Orbs collected:
                <strong>
                    ${orbs}
                </strong>
            </p>

            <p class="accent">
                Press R to restart
            </p>
        `;


        message.classList.add(
            "show"
        );


        return;
    }


    if (paused) {

        updateShopMessage();

        return;
    }


    message.classList.remove(
        "show"
    );
}


/* ==================================================
   SPAWN POSITION
================================================== */

function randomEdgePosition(
    margin = 50
) {

    const side =
        Math.floor(
            Math.random() * 4
        );


    if (side === 0) {

        return {
            x:
                Math.random() *
                width,

            y:
                -margin
        };
    }


    if (side === 1) {

        return {
            x:
                width + margin,

            y:
                Math.random() *
                height
        };
    }


    if (side === 2) {

        return {
            x:
                Math.random() *
                width,

            y:
                height + margin
        };
    }


    return {

        x:
            -margin,

        y:
            Math.random() *
            height
    };
}


/* ==================================================
   SPAWN ENEMY
================================================== */

function spawnEnemy() {

    const pos =
        randomEdgePosition();


    const difficulty =
        1 +
        timeAlive /
        30;


    const roll =
        Math.random();


    let type =
        "normal";


    /*
        Fast enemies.
    */

    if (
        timeAlive > 20 &&
        roll < 0.20
    ) {

        type =
            "fast";
    }


    /*
        Tanks.
    */

    if (
        timeAlive > 45 &&
        roll > 0.82
    ) {

        type =
            "tank";
    }


    const enemy = {

        x: pos.x,
        y: pos.y,

        rotation:
            Math.random() *
            Math.PI *
            2,

        type: type,

        hitFlash: 0
    };


    if (
        type === "fast"
    ) {

        enemy.radius = 9;

        enemy.speed =
            115 *
            difficulty;

        enemy.hp = 1;

        enemy.points = 150;
    }


    else if (
        type === "tank"
    ) {

        enemy.radius = 22;

        enemy.speed =
            42 *
            difficulty;

        enemy.hp = 3;

        enemy.points = 400;
    }


    else {

        enemy.radius = 14;

        enemy.speed =
            62 *
            difficulty;

        enemy.hp = 1;

        enemy.points = 100;
    }


    enemies.push(
        enemy
    );
}


/* ==================================================
   SPAWN ORB
================================================== */

function spawnOrb() {

    const padding = 70;


    orbsOnMap.push({

        x:
            padding +
            Math.random() *
            Math.max(
                1,
                width -
                padding * 2
            ),

        y:
            padding +
            Math.random() *
            Math.max(
                1,
                height -
                padding * 2
            ),

        radius: 7,

        pulse:
            Math.random() *
            Math.PI *
            2,

        life: 8
    });
}


/* ==================================================
   PARTICLES
================================================== */

function makeParticles(
    x,
    y,
    color,
    amount = 10,
    speed = 150
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;


        const velocity =
            speed *
            (
                0.3 +
                Math.random() *
                0.7
            );


        particles.push({

            x: x,
            y: y,

            dx:
                Math.cos(angle) *
                velocity,

            dy:
                Math.sin(angle) *
                velocity,

            life:
                0.3 +
                Math.random() *
                0.5,

            maxLife:
                0.8,

            size:
                1.5 +
                Math.random() *
                3,

            color:
                color
        });
    }
}


/* ==================================================
   SHOOT
================================================== */

function shoot() {

    if (
        gameOver ||
        paused
    ) {

        return;
    }


    if (
        player.fireCooldown > 0
    ) {

        return;
    }


    const muzzle =
        31;


    const x =
        player.x +
        Math.cos(
            player.aimAngle
        ) *
        muzzle;


    const y =
        player.y +
        Math.sin(
            player.aimAngle
        ) *
        muzzle;


    bullets.push({

        x: x,
        y: y,

        dx:
            Math.cos(
                player.aimAngle
            ),

        dy:
            Math.sin(
                player.aimAngle
            ),

        radius: 4,

        speed:
            player.bulletSpeed,

        damage:
            player.bulletDamage,

        life: 1.25
    });


    player.fireCooldown =
        player.fireRate;


    makeParticles(
        x,
        y,
        COLORS.white,
        8,
        220
    );


    screenShake =
        Math.max(
            screenShake,
            2
        );
}


/* ==================================================
   DASH
================================================== */

function dash() {

    if (
        gameOver ||
        paused
    ) {

        return;
    }


    if (
        player.dashCooldown > 0
    ) {

        return;
    }


    let dx = 0;
    let dy = 0;


    if (
        down("w") ||
        down("arrowup")
    ) {

        dy -= 1;
    }


    if (
        down("s") ||
        down("arrowdown")
    ) {

        dy += 1;
    }


    if (
        down("a") ||
        down("arrowleft")
    ) {

        dx -= 1;
    }


    if (
        down("d") ||
        down("arrowright")
    ) {

        dx += 1;
    }


    const length =
        Math.hypot(
            dx,
            dy
        );


    if (
        length === 0
    ) {

        dx =
            player.dashX;

        dy =
            player.dashY;

    }

    else {

        dx /=
            length;

        dy /=
            length;
    }


    player.dashX =
        dx;

    player.dashY =
        dy;


    player.dashTime =
        player.dashDuration;


    player.dashCooldown =
        player.dashMaxCooldown;


    makeParticles(
        player.x,
        player.y,
        COLORS.cyan,
        25,
        260
    );
}


/* ==================================================
   UPDATE
================================================== */

function update(delta) {

    /*
        Shop cooldown keeps
        running even while the
        shop is open.
    */

    if (
        shopCooldown > 0
    ) {

        shopCooldown =
            Math.max(
                0,
                shopCooldown -
                delta
            );
    }


    if (
        shopReadyDelay > 0
    ) {

        shopReadyDelay =
            Math.max(
                0,
                shopReadyDelay -
                delta
            );
    }


    /*
        Game paused.
    */

    if (
        gameOver ||
        paused
    ) {

        updateParticles(
            delta
        );

        return;
    }


    /* ----------------------------------------------
       SURVIVAL
    ---------------------------------------------- */

    timeAlive +=
        delta;


    score =
        Math.floor(
            timeAlive * 10
        );


    screenShake =
        Math.max(
            0,
            screenShake -
            delta * 12
        );


    /* ----------------------------------------------
       AIM
    ---------------------------------------------- */

    let aimX = 0;
    let aimY = 0;


    if (
        down("i") ||
        down("arrowup")
    ) {

        aimY -= 1;
    }


    if (
        down("k") ||
        down("arrowdown")
    ) {

        aimY += 1;
    }


    if (
        down("j") ||
        down("arrowleft")
    ) {

        aimX -= 1;
    }


    if (
        down("l") ||
        down("arrowright")
    ) {

        aimX += 1;
    }


    const aimLength =
        Math.hypot(
            aimX,
            aimY
        );


    if (
        aimLength > 0
    ) {

        aimX /=
            aimLength;

        aimY /=
            aimLength;


        player.aimX =
            aimX;

        player.aimY =
            aimY;


        player.aimAngle =
            Math.atan2(
                aimY,
                aimX
            );
    }


    /* ----------------------------------------------
       MOVEMENT
    ---------------------------------------------- */

    let moveX = 0;
    let moveY = 0;


    if (down("w")) {
        moveY -= 1;
    }

    if (down("s")) {
        moveY += 1;
    }

    if (down("a")) {
        moveX -= 1;
    }

    if (down("d")) {
        moveX += 1;
    }


    const moveLength =
        Math.hypot(
            moveX,
            moveY
        );


    if (
        moveLength > 0
    ) {

        moveX /=
            moveLength;

        moveY /=
            moveLength;


        player.dashX =
            moveX;

        player.dashY =
            moveY;
    }


    /* ----------------------------------------------
       COOLDOWNS
    ---------------------------------------------- */

    if (
        player.fireCooldown > 0
    ) {

        player.fireCooldown -=
            delta;
    }


    if (
        player.dashCooldown > 0
    ) {

        player.dashCooldown -=
            delta;
    }


    /*
        Hold Space to fire.
    */

    if (
        down(" ")
    ) {

        shoot();
    }


    /* ----------------------------------------------
       MOVEMENT
    ---------------------------------------------- */

    if (
        player.dashTime > 0
    ) {

        player.dashTime -=
            delta;


        player.x +=
            player.dashX *
            player.dashSpeed *
            delta;


        player.y +=
            player.dashY *
            player.dashSpeed *
            delta;
    }


    else {

        player.x +=
            moveX *
            player.moveSpeed *
            delta;


        player.y +=
            moveY *
            player.moveSpeed *
            delta;
    }


    /*
        Arena boundaries.
    */

    player.x =
        Math.max(
            player.radius,
            Math.min(
                width -
                player.radius,
                player.x
            )
        );


    player.y =
        Math.max(
            player.radius,
            Math.min(
                height -
                player.radius,
                player.y
            )
        );


    /* ----------------------------------------------
       SPAWNING
    ---------------------------------------------- */

    spawnTimer -=
        delta;


    const spawnInterval =
        Math.max(
            0.16,
            1.0 -
            timeAlive *
            0.009
        );


    if (
        spawnTimer <= 0
    ) {

        spawnEnemy();

        spawnTimer =
            spawnInterval;
    }


    orbTimer -=
        delta;


    if (
        orbTimer <= 0
    ) {

        if (
            orbsOnMap.length < 3
        ) {

            spawnOrb();
        }

        orbTimer =
            2.5;
    }


    /* ----------------------------------------------
       OBJECTS
    ---------------------------------------------- */

    updateBullets(delta);

    updateEnemies(delta);

    updateOrbs(delta);

    updateParticles(delta);
}


/* ==================================================
   BULLETS
================================================== */

function updateBullets(
    delta
) {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        bullet.x +=
            bullet.dx *
            bullet.speed *
            delta;


        bullet.y +=
            bullet.dy *
            bullet.speed *
            delta;


        bullet.life -=
            delta;


        if (
            bullet.life <= 0 ||
            bullet.x < -60 ||
            bullet.x > width + 60 ||
            bullet.y < -60 ||
            bullet.y > height + 60
        ) {

            bullets.splice(
                i,
                1
            );

            continue;
        }


        /*
            Bullet collision.
        */

        let destroyed =
            false;


        for (
            let j =
                enemies.length - 1;

            j >= 0;

            j--
        ) {

            const enemy =
                enemies[j];


            if (
                distance(
                    bullet,
                    enemy
                ) <
                bullet.radius +
                enemy.radius
            ) {

                enemy.hp -=
                    bullet.damage;


                enemy.hitFlash =
                    0.08;


                makeParticles(
                    bullet.x,
                    bullet.y,
                    COLORS.white,
                    7,
                    170
                );


                bullets.splice(
                    i,
                    1
                );


                destroyed =
                    true;


                if (
                    enemy.hp <= 0
                ) {

                    score +=
                        enemy.points;


                    makeParticles(
                        enemy.x,
                        enemy.y,
                        COLORS.red,
                        enemy.type === "tank"
                            ? 30
                            : 18,
                        220
                    );


                    screenShake =
                        Math.max(
                            screenShake,
                            enemy.type === "tank"
                                ? 6
                                : 3
                        );


                    enemies.splice(
                        j,
                        1
                    );
                }


                break;
            }
        }


        if (
            destroyed
        ) {

            continue;
        }
    }
}


/* ==================================================
   ENEMIES
================================================== */

function updateEnemies(
    delta
) {

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];


        const angle =
            Math.atan2(
                player.y -
                enemy.y,

                player.x -
                enemy.x
            );


        enemy.x +=
            Math.cos(angle) *
            enemy.speed *
            delta;


        enemy.y +=
            Math.sin(angle) *
            enemy.speed *
            delta;


        enemy.rotation +=
            delta *
            (
                enemy.type === "fast"
                    ? 4
                    : 2
            );


        enemy.hitFlash =
            Math.max(
                0,
                enemy.hitFlash -
                delta
            );


        /*
            Collision with player.
        */

        if (
            distance(
                player,
                enemy
            ) <
            player.radius +
            enemy.radius
        ) {

            /*
                Remove enemy immediately
                so the player can't take
                multiple damage from the
                same enemy.
            */

            enemies.splice(
                i,
                1
            );


            damagePlayer();

            if (
                gameOver
            ) {

                return;
            }
        }
    }
}


/* ==================================================
   PLAYER DAMAGE
================================================== */

function damagePlayer() {

    player.health -= 1;


    makeParticles(
        player.x,
        player.y,
        COLORS.red,
        30,
        250
    );


    screenShake =
        10;


    /*
        Small invulnerability window
        isn't implemented as a permanent
        timer, so give the player a short
        dash-like separation instead.
    */

    player.x +=
        player.dashX *
        20;

    player.y +=
        player.dashY *
        20;


    if (
        player.health <= 0
    ) {

        endGame();
    }
}


/* ==================================================
   ORBS
================================================== */

function updateOrbs(
    delta
) {

    for (
        let i =
            orbsOnMap.length - 1;

        i >= 0;

        i--
    ) {

        const orb =
            orbsOnMap[i];


        orb.life -=
            delta;


        orb.pulse +=
            delta * 5;


        if (
            distance(
                player,
                orb
            ) <
            player.radius +
            orb.radius +
            5
        ) {

            /*
                Yellow orbs are now
                shop currency.
            */

            orbs += 1;


            makeParticles(
                orb.x,
                orb.y,
                COLORS.yellow,
                25,
                220
            );


            orbsOnMap.splice(
                i,
                1
            );
        }


        else if (
            orb.life <= 0
        ) {

            orbsOnMap.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   PARTICLES
================================================== */

function updateParticles(
    delta
) {

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            particles[i];


        particle.life -=
            delta;


        particle.x +=
            particle.dx *
            delta;


        particle.y +=
            particle.dy *
            delta;


        particle.dx *=
            Math.pow(
                0.05,
                delta
            );


        particle.dy *=
            Math.pow(
                0.05,
                delta
            );


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}


/* ==================================================
   GAME OVER
================================================== */

function endGame() {

    gameOver =
        true;


    if (
        score >
        highScore
    ) {

        highScore =
            score;


        localStorage.setItem(
            "neonEscapeHighScore",
            String(highScore)
        );
    }


    makeParticles(
        player.x,
        player.y,
        COLORS.red,
        55,
        300
    );


    screenShake =
        12;


    updateMessage();
}


/* ==================================================
   DRAW
================================================== */

function draw() {

    ctx.save();


    if (
        screenShake > 0
    ) {

        ctx.translate(

            (
                Math.random() -
                0.5
            ) *
            screenShake,

            (
                Math.random() -
                0.5
            ) *
            screenShake
        );
    }


    drawBackground();

    drawOrbs();

    drawEnemies();

    drawBullets();

    drawParticles();

    drawPlayer();

    drawUI();


    ctx.restore();
}


/* ==================================================
   BACKGROUND
================================================== */

function drawBackground() {

    ctx.fillStyle =
        COLORS.bg;


    ctx.fillRect(
        -20,
        -20,
        width + 40,
        height + 40
    );


    const grid =
        50;


    ctx.strokeStyle =
        COLORS.grid;

    ctx.lineWidth =
        1;


    for (
        let x = 0;

        x <= width;

        x += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            height
        );

        ctx.stroke();
    }


    for (
        let y = 0;

        y <= height;

        y += grid
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }
}


/* ==================================================
   PLAYER DRAW
================================================== */

function drawPlayer() {

    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    ctx.rotate(
        player.aimAngle
    );


    /*
        Cannon
    */

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        COLORS.cyan;


    ctx.fillStyle =
        COLORS.cyan;


    ctx.fillRect(
        0,
        -4,
        32,
        8
    );


    ctx.fillStyle =
        COLORS.white;


    ctx.fillRect(
        26,
        -5,
        8,
        10
    );


    /*
        Ship
    */

    ctx.shadowBlur =
        25;

    ctx.shadowColor =
        COLORS.cyan;


    ctx.fillStyle =
        COLORS.cyan;


    ctx.beginPath();

    ctx.moveTo(
        20,
        0
    );

    ctx.lineTo(
        -12,
        -10
    );

    ctx.lineTo(
        -7,
        0
    );

    ctx.lineTo(
        -12,
        10
    );

    ctx.closePath();

    ctx.fill();


    /*
        Inner ship
    */

    ctx.shadowBlur =
        0;

    ctx.fillStyle =
        COLORS.bg;


    ctx.beginPath();

    ctx.moveTo(
        10,
        0
    );

    ctx.lineTo(
        -6,
        -5
    );

    ctx.lineTo(
        -3,
        0
    );

    ctx.lineTo(
        -6,
        5
    );

    ctx.closePath();

    ctx.fill();


    ctx.restore();


    /*
        Dash ready ring.
    */

    if (
        player.dashCooldown <= 0
    ) {

        ctx.strokeStyle =
            "rgba(0,255,255,.7)";

        ctx.lineWidth =
            2;


        ctx.beginPath();

        ctx.arc(
            player.x,
            player.y,

            player.radius +
            8 +
            Math.sin(
                performance.now() /
                100
            ) * 2,

            0,
            Math.PI * 2
        );

        ctx.stroke();
    }
}


/* ==================================================
   BULLETS DRAW
================================================== */

function drawBullets() {

    ctx.fillStyle =
        COLORS.white;


    ctx.shadowBlur =
        14;

    ctx.shadowColor =
        COLORS.white;


    for (
        const bullet of bullets
    ) {

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.shadowBlur =
        0;
}


/* ==================================================
   ENEMY DRAW
================================================== */

function drawEnemies() {

    for (
        const enemy of enemies
    ) {

        ctx.save();


        ctx.translate(
            enemy.x,
            enemy.y
        );


        ctx.rotate(
            enemy.rotation
        );


        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            COLORS.red;


        ctx.fillStyle =
            enemy.hitFlash > 0
                ? COLORS.white
                : COLORS.red;


        /*
            Tank
        */

        if (
            enemy.type === "tank"
        ) {

            ctx.beginPath();

            ctx.rect(
                -enemy.radius,
                -enemy.radius,
                enemy.radius * 2,
                enemy.radius * 2
            );

            ctx.fill();


            ctx.fillStyle =
                COLORS.bg;


            ctx.fillRect(
                -7,
                -7,
                14,
                14
            );
        }


        /*
            Fast
        */

        else if (
            enemy.type === "fast"
        ) {

            ctx.beginPath();

            ctx.moveTo(
                enemy.radius,
                0
            );

            ctx.lineTo(
                -enemy.radius,
                -enemy.radius *
                0.65
            );

            ctx.lineTo(
                -enemy.radius,
                enemy.radius *
                0.65
            );

            ctx.closePath();

            ctx.fill();
        }


        /*
            Normal
        */

        else {

            ctx.beginPath();


            for (
                let i = 0;

                i < 8;

                i++
            ) {

                const angle =
                    i *
                    Math.PI /
                    4;


                const radius =
                    i % 2 === 0
                        ? enemy.radius
                        : enemy.radius *
                          0.45;


                const x =
                    Math.cos(angle) *
                    radius;


                const y =
                    Math.sin(angle) *
                    radius;


                if (
                    i === 0
                ) {

                    ctx.moveTo(
                        x,
                        y
                    );

                }

                else {

                    ctx.lineTo(
                        x,
                        y
                    );
                }
            }


            ctx.closePath();

            ctx.fill();
        }


        /*
            Tank health indicator.
        */

        if (
            enemy.type === "tank"
        ) {

            const healthWidth =
                enemy.radius * 2;


            const healthRatio =
                Math.max(
                    0,
                    enemy.hp / 3
                );


            ctx.fillStyle =
                "rgba(255,255,255,.2)";


            ctx.fillRect(
                -enemy.radius,
                enemy.radius + 7,
                healthWidth,
                3
            );


            ctx.fillStyle =
                COLORS.white;


            ctx.fillRect(
                -enemy.radius,
                enemy.radius + 7,
                healthWidth *
                healthRatio,
                3
            );
        }


        ctx.restore();
    }
}


/* ==================================================
   ORB DRAW
================================================== */

function drawOrbs() {

    for (
        const orb of orbsOnMap
    ) {

        const scale =
            1 +
            Math.sin(
                orb.pulse
            ) *
            0.25;


        ctx.save();


        ctx.translate(
            orb.x,
            orb.y
        );


        ctx.scale(
            scale,
            scale
        );


        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            COLORS.yellow;


        ctx.fillStyle =
            COLORS.yellow;


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            orb.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        ctx.restore();
    }
}


/* ==================================================
   PARTICLES DRAW
================================================== */

function drawParticles() {

    for (
        const particle of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life /
                particle.maxLife
            );


        ctx.fillStyle =
            particle.color;


        ctx.fillRect(
            particle.x,
            particle.y,
            particle.size,
            particle.size
        );
    }


    ctx.globalAlpha =
        1;
}


/* ==================================================
   UI
================================================== */

function drawUI() {

    ctx.shadowBlur =
        0;


    ctx.textAlign =
        "left";


    ctx.fillStyle =
        COLORS.white;


    ctx.font =
        "bold 20px Arial";


    ctx.fillText(
        `SCORE ${score}`,
        20,
        30
    );


    ctx.font =
        "14px Arial";


    ctx.fillText(
        `TIME ${timeAlive.toFixed(1)}s`,
        20,
        52
    );


    /*
        Health
    */

    ctx.fillStyle =
        COLORS.red;


    ctx.font =
        "bold 14px Arial";


    ctx.fillText(
        "HP",
        20,
        75
    );


    for (
        let i = 0;

        i < player.maxHealth;

        i++
    ) {

        ctx.fillStyle =
            i <
            player.health
                ? COLORS.red
                : "rgba(255,255,255,.15)";


        ctx.fillRect(
            50 +
            i * 18,
            65,
            13,
            10
        );
    }


    /*
        Orbs
    */

    ctx.fillStyle =
        COLORS.yellow;


    ctx.font =
        "bold 15px Arial";


    ctx.fillText(
        `ORBS ${orbs}`,
        20,
        96
    );


    /*
        Best score
    */

    ctx.textAlign =
        "right";


    ctx.fillStyle =
        COLORS.white;


    ctx.font =
        "14px Arial";


    ctx.fillText(
        `BEST ${highScore}`,
        width - 20,
        30
    );


    /*
        Shop cooldown.
    */

    if (
        shopCooldown > 0
    ) {

        ctx.fillStyle =
            COLORS.red;


        ctx.fillText(
            `SHOP ${shopCooldown.toFixed(1)}s`,
            width - 20,
            52
        );

    }

    else if (
        shopReadyDelay > 0
    ) {

        ctx.fillStyle =
            "#888";


        ctx.fillText(
            "SHOP LOADING",
            width - 20,
            52
        );

    }

    else {

        ctx.fillStyle =
            COLORS.cyan;


        ctx.fillText(
            "SHOP READY",
            width - 20,
            52
        );
    }


    /*
        Dash bar.
    */

    const barWidth =
        120;

    const barHeight =
        7;


    const dashProgress =
        Math.max(
            0,
            1 -
            player.dashCooldown /
            player.dashMaxCooldown
        );


    ctx.textAlign =
        "left";


    ctx.fillStyle =
        "rgba(255,255,255,.16)";


    ctx.fillRect(
        20,
        height - 30,
        barWidth,
        barHeight
    );


    ctx.fillStyle =
        COLORS.cyan;


    ctx.fillRect(
        20,
        height - 30,
        barWidth *
        dashProgress,
        barHeight
    );


    /*
        Controls.
    */

    ctx.font =
        "12px Arial";


    ctx.fillStyle =
        "rgba(255,255,255,.72)";


    ctx.fillText(
        "WASD MOVE   IJKL AIM   SPACE FIRE   SHIFT DASH   P SHOP",
        20,
        height - 40
    );


    ctx.textAlign =
        "right";


    ctx.fillText(
        "Yellow orbs = shop currency",
        width - 20,
        height - 20
    );


    ctx.textAlign =
        "left";
}


/* ==================================================
   MAIN LOOP
================================================== */

function frame(now) {

    const delta =
        Math.min(
            (now - lastTime) /
            1000,
            0.05
        );


    lastTime =
        now;


    update(
        delta
    );


    draw();


    requestAnimationFrame(
        frame
    );
}


/* ==================================================
   START
================================================== */

resize();

restart();

requestAnimationFrame(
    frame
);

</script>

</body>
</html>
